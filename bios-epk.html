<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>BIOS EPK // nonrocker records</title><link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet"/><style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#c8c8c8;font-family:VT323,monospace;font-size:clamp(18px,2.2vw,24px);min-height:100vh;overflow:hidden}body:after{content:"";position:fixed;inset:0;background:repeating-linear-gradient(to bottom,transparent 0 2px,rgba(0,0,0,.2) 3px,transparent 4px);pointer-events:none}.bar{background:#00aaaa;color:#000;padding:.25em 1em;display:flex;justify-content:space-between}.screen{height:calc(100vh - 2.1em);display:grid;grid-template-columns:1fr 330px;gap:28px;padding:28px}.menu{border:1px solid #00aaaa;padding:16px}.row{display:flex;gap:16px;padding:.2em .5em;cursor:pointer}.row.active{background:#00aaaa;color:#000}.row span:first-child{width:42%}.row span:last-child{color:#39ff14}.row.active span:last-child{color:#000}.help{border:1px solid #555;padding:16px;color:#888}.help b{color:#ffb800}.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;place-items:center}.box{width:min(720px,92vw);border:2px solid #fff;background:#000080;color:#fff;padding:24px;box-shadow:0 0 0 6px #000}.box h2{margin:0 0 12px;background:#fff;color:#000080;display:inline-block;padding:0 6px}.box button{font:inherit;background:#c8c8c8;color:#000;border:0;padding:3px 18px;margin-top:16px}@media(max-width:760px){.screen{grid-template-columns:1fr;height:auto}.help{display:none}body{overflow:auto}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body>
<div class="bar"><b>NRK-BIOS SETUP UTILITY</b><span><a href="variations.html">DIRECTORY</a> | <a href="index.html">EPK</a></span></div>
<main class="screen"><section class="menu" id="menu"></section><aside class="help"><b>HELP</b><p>Use arrow keys to choose a boot device. Press Enter to inspect. The machine will not become normal.</p><p>F10: save chaos. ESC: return to void.</p></aside></main>
<div class="modal" id="modal"><div class="box"><h2 id="mt">TITLE</h2><div id="mc"></div><button id="close" type="button">OK</button></div></div>
<script>
const items=[['Primary Master','SOJU NATION','Booking wants smoke, neon, two outlets, and one apology letter.'],['Secondary Master','TRACKLIST.SYS','METALDATA boots first. Track 4 starts listening back.'],['Boot Device 1','PRESS_QUOTE.EXE','A haunted arcade cabinet suing a karaoke machine. Five stars from nobody real.'],['Boot Device 2','TOUR_DATES.VXD','Basement / Mall Fountain / Unlicensed Planetarium / Your Dream Last Night.'],['Security Chip','DRUMMER_NO','The drummer denies all boot responsibility.'],['Exit Route','CONTACT.BAT','booking@nonrocker.fake | press@nonrocker.fake']];let sel=0;const menu=document.getElementById('menu'),modal=document.getElementById('modal');
function render(){menu.innerHTML=items.map((r,i)=>`<div class="row ${i===sel?'active':''}" data-i="${i}"><span>${r[0]}</span><span>[${r[1]}]</span></div>`).join('');document.querySelectorAll('.row').forEach(r=>r.onclick=()=>{sel=+r.dataset.i;render();openBox();});}
function openBox(){document.getElementById('mt').textContent=items[sel][1];document.getElementById('mc').textContent=items[sel][2];modal.style.display='grid';}
addEventListener('keydown',e=>{if(e.key==='ArrowDown'){sel=(sel+1)%items.length;render()}if(e.key==='ArrowUp'){sel=(sel+items.length-1)%items.length;render()}if(e.key==='Enter')openBox();if(e.key==='Escape')modal.style.display='none';});document.getElementById('close').onclick=()=>modal.style.display='none';render();
</script></body></html>
