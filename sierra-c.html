<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>NRK-666: QUEST FOR THE KAZOO</title>
<link href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet"/>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;background:#000;overflow:hidden;cursor:none;}

  /* CRT */
  body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(to bottom,transparent 0,transparent 2px,rgba(0,0,0,.14) 3px,transparent 4px);pointer-events:none;z-index:9900;}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 38%,rgba(0,0,0,.82) 100%);pointer-events:none;z-index:9800;}

  #screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}

  /* ── PIXEL RAIN ── */
  #rain{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;}
  .rain-col{position:absolute;top:-100px;font-family:'VT323',monospace;font-size:14px;color:rgba(0,240,255,.25);line-height:14px;animation:fall linear infinite;white-space:nowrap;}
  @keyframes fall{to{transform:translateY(calc(100vh + 200px));}}

  /* ── PHASE: STATIC ── */
  #ph-static{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;}
  #static-cv{position:absolute;inset:0;width:100%;height:100%;}
  .static-text{position:relative;z-index:2;font-family:'Press Start 2P',monospace;font-size:clamp(7px,1.2vw,12px);color:rgba(255,255,255,.6);letter-spacing:.15em;text-align:center;}

  /* ── PHASE: SCENE ── */
  #ph-scene{
    position:fixed;inset:0;z-index:30;
    display:none;flex-direction:column;
    align-items:center;justify-content:center;
  }

  /* scene image with NRK border */
  .scene-frame{
    position:relative;
    width:min(96vw,calc(90vh*1.5));
    flex-shrink:0;
    border:3px solid #ff00cc;
    box-shadow:0 0 30px rgba(255,0,204,.5),0 0 80px rgba(255,0,204,.2),inset 0 0 20px rgba(0,0,0,.6);
    overflow:hidden;
  }
  .scene-frame img{
    display:block;width:100%;
    image-rendering:pixelated;
  }
  /* chromatic aberration on edges */
  .scene-frame::before{
    content:'';position:absolute;inset:0;
    background:linear-gradient(90deg,rgba(255,0,204,.12) 0%,transparent 15%,transparent 85%,rgba(0,240,255,.12) 100%);
    pointer-events:none;z-index:2;
  }
  /* animated gradient border pulse */
  .scene-frame::after{
    content:'';position:absolute;inset:-2px;
    background:conic-gradient(from var(--angle,0deg),#ff00cc,#7a00ff,#00f0ff,#39ff14,#ff00cc);
    z-index:-1;animation:spin 4s linear infinite;
  }
  @property --angle{syntax:'<angle>';initial-value:0deg;inherits:false;}
  @keyframes spin{to{--angle:360deg;}}

  /* NRK dialog box (pink/black, NOT Sierra white) */
  .nrk-dialog{
    position:relative;
    background:#000;
    border:2px solid #ff00cc;
    box-shadow:0 0 20px rgba(255,0,204,.4),inset 0 0 10px rgba(255,0,204,.06);
    padding:.6em 1em;
    width:min(96vw,calc(90vh*1.5));
    margin-top:6px;
    min-height:3.5em;
    display:none;
  }
  .dlg-speaker{
    font-family:'Press Start 2P',monospace;
    font-size:clamp(6px,1vw,10px);
    color:#ff00cc;letter-spacing:.12em;
    text-shadow:0 0 10px #ff00cc;
    margin-bottom:.35em;
  }
  .dlg-line{
    font-family:'VT323',monospace;
    font-size:clamp(16px,2.5vw,26px);
    color:#f4eaff;letter-spacing:.04em;line-height:1.35;
  }
  .dlg-icon{margin-right:.4em;}
  .dlg-next{
    position:absolute;bottom:.35em;right:.7em;
    font-family:'Press Start 2P',monospace;
    font-size:clamp(5px,.8vw,8px);
    color:rgba(255,0,204,.5);letter-spacing:.1em;
    animation:blink .8s step-end infinite;
  }
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

  /* ── WIN95 ERROR DIALOG ── */
  #win95{
    position:fixed;z-index:200;
    background:#d4d0c8;
    border-top:2px solid #fff;border-left:2px solid #fff;
    border-right:2px solid #404040;border-bottom:2px solid #404040;
    width:clamp(240px,38vw,360px);
    display:none;top:50%;left:50%;transform:translate(-50%,-50%);
    box-shadow:4px 4px 0 rgba(0,0,0,.5);
    font-family:Arial,sans-serif;font-size:11px;
  }
  .w95-title{
    background:linear-gradient(90deg,#000080,#1084d0);
    color:#fff;padding:3px 5px;font-weight:bold;font-size:11px;
    display:flex;justify-content:space-between;align-items:center;
  }
  .w95-body{padding:12px 14px 8px;display:flex;align-items:flex-start;gap:10px;}
  .w95-icon{font-size:26px;flex-shrink:0;}
  .w95-msg{font-size:11px;color:#000;line-height:1.5;}
  .w95-msg strong{color:#cc0000;}
  .w95-btns{padding:4px 14px 10px;display:flex;justify-content:center;gap:8px;}
  .w95-btn{
    background:#d4d0c8;border-top:1px solid #fff;border-left:1px solid #fff;
    border-right:1px solid #404040;border-bottom:1px solid #404040;
    padding:3px 16px;font-size:11px;cursor:pointer;min-width:70px;
  }
  .w95-btn:active{border-top:1px solid #404040;border-left:1px solid #404040;border-right:1px solid #fff;border-bottom:1px solid #fff;}
  .w95-btn.default{border:2px solid #000;padding:2px 14px;}

  /* ── TITLE SLAM ── */
  #ph-title{
    position:fixed;inset:0;z-index:40;
    display:none;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(0,0,0,.92);
  }
  .title-nrk{
    font-family:'Metal Mania',serif;
    font-size:clamp(56px,14vw,140px);
    color:#ff00cc;
    text-shadow:0 0 30px #ff00cc,0 0 80px rgba(255,0,204,.4),4px 4px 0 #7a00ff;
    letter-spacing:.06em;
    animation:slam .25s cubic-bezier(.17,.67,.41,1.54);
    line-height:.9;
    text-align:center;
  }
  @keyframes slam{0%{transform:scale(2.5);opacity:0}100%{transform:scale(1);opacity:1}}
  .title-quest{
    font-family:'VT323',monospace;
    font-size:clamp(20px,4vw,44px);
    color:#00f0ff;letter-spacing:.18em;
    text-shadow:0 0 16px #00f0ff;
    margin-top:.3em;text-align:center;
  }
  .title-cat{
    font-family:'Press Start 2P',monospace;
    font-size:clamp(6px,1vw,10px);
    color:#7a00ff;letter-spacing:.2em;
    border:1px solid rgba(122,0,255,.5);
    padding:.3em 1.2em;margin-top:1.2em;
  }
  .title-press{
    font-family:'Press Start 2P',monospace;
    font-size:clamp(7px,1.1vw,11px);
    color:rgba(255,255,255,.45);letter-spacing:.18em;
    margin-top:2em;
    animation:blink 1.1s step-end infinite;
  }
</style>
</head>
<body>

<!-- pixel rain -->
<div id="rain"></div>

<!-- PHASE 1: STATIC -->
<div id="ph-static">
  <canvas id="static-cv"></canvas>
  <div class="static-text">&#9608;&#9608;&#9608; NRK SIGNAL &#9608;&#9608;&#9608;</div>
</div>

<!-- PHASE 2: SCENE + DIALOGS -->
<div id="ph-scene">
  <div class="scene-frame">
    <img src="sierra-scene.png" alt="London Park — NRK Scene"/>
  </div>
  <div class="nrk-dialog" id="nrk-dlg">
    <div class="dlg-speaker" id="dlg-spk"></div>
    <div class="dlg-line" id="dlg-line"></div>
    <div class="dlg-next">&#9654; click / any key</div>
  </div>
</div>

<!-- WIN95 ERROR -->
<div id="win95">
  <div class="w95-title">
    <span>&#9888; SKULL.SYS</span>
    <span style="cursor:default">&#x2715;</span>
  </div>
  <div class="w95-body">
    <div class="w95-icon">&#128128;</div>
    <div class="w95-msg">
      <strong>SKULL.SYS</strong> has caused a general protection fault<br/>
      in module <strong>REALITY.EXE</strong>.<br/><br/>
      The current operation will be<br/>
      <strong>terminated by NRK-666</strong>.
    </div>
  </div>
  <div class="w95-btns">
    <button class="w95-btn default" id="w95-ok">OK</button>
    <button class="w95-btn" id="w95-cancel">Cancel</button>
  </div>
</div>

<!-- PHASE 3: TITLE SLAM -->
<div id="ph-title">
  <div class="title-nrk">NRK-666</div>
  <div class="title-quest">QUEST FOR THE KAZOO</div>
  <div class="title-cat">NRK-ADV-666 &nbsp;&#183;&nbsp; nonrocker records</div>
  <div class="title-press">press any key to enter the EPK</div>
</div>

<script>
// AUDIO
let ctx=null;
function initA(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();}
function tone(f,d,type='sawtooth',v=0.12,t=0){initA();const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,ctx.currentTime+t);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+t+d);o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+d+.01);}
function glitchSound(){[80,160,40,320].forEach((f,i)=>tone(f,.04,'sawtooth',.15,i*.05));}
function titleSlam(){[130,196,261,392,523].forEach((f,i)=>tone(f,.3,'sawtooth',.18,i*.06));tone(65,.6,'sawtooth',.22,.0);}

// PIXEL RAIN
(function(){
  const rain=document.getElementById('rain');
  const chars='01NRK소주막걸리666';
  for(let i=0;i<32;i++){
    const col=document.createElement('div');
    col.className='rain-col';
    col.style.left=(Math.random()*100)+'%';
    col.style.animationDuration=(Math.random()*6+4)+'s';
    col.style.animationDelay=(-Math.random()*8)+'s';
    col.style.fontSize=(Math.random()*6+10)+'px';
    col.style.opacity=(Math.random()*.2+.05);
    let txt='';for(let j=0;j<60;j++)txt+=chars[0|Math.random()*chars.length]+'\n';
    col.textContent=txt;
    rain.appendChild(col);
  }
})();

// STATIC CANVAS
const sv=document.getElementById('static-cv');
sv.width=innerWidth;sv.height=innerHeight;
const sx=sv.getContext('2d');
let staticRunning=true;
(function staticLoop(){
  if(!staticRunning)return;
  requestAnimationFrame(staticLoop);
  const id=sx.createImageData(sv.width,sv.height);
  const d=id.data;
  for(let i=0;i<d.length;i+=4){const v=Math.random()*255|0;d[i]=d[i+1]=d[i+2]=v;d[i+3]=Math.random()<.3?255:0;}
  sx.putImageData(id,0,0);
})();

// DIALOGS
const DIALOGS=[
  {spk:'KAZOO_HAWK',icon:'&#128054;',line:'"The album NRK-2024 has been corrupted by WIN95. Take the hat. Find the goose. Save the didgeridoos."'},
  {spk:'STATUE.EXE',icon:'&#129302;',line:'"[process: quest_for_kazoo.exe] [status: CRITICAL] [kazoo_integrity: 0%]"'},
  {spk:'NULLSOFT',icon:'&#127929;',line:'"...the hat has a blue gem. KAZOO_HAWK — is the gem the goose? Is this a metaphor?"'},
  {spk:'DJ 막걸리',icon:'&#127908;',line:'"I found a clue. It smells like soju. Everything leads to the biggest goose in all of London."},
  {spk:'YUNG SOJU',icon:'&#129346;',line:'"Let\'s go get the biggest goose in all of London. For the kazoo. For NRK-2024. For all of this."'},
];
let dlgIdx=0,phase=0;

function showPhase(id){
  document.getElementById('ph-static').style.display='none';
  document.getElementById('ph-scene').style.display='none';
  document.getElementById('ph-title').style.display='none';
  document.getElementById(id).style.display='flex';
}

function advance(){
  initA();
  if(phase===0){
    // static -> scene
    phase=1;staticRunning=false;
    sv.style.display='none';
    showPhase('ph-scene');
    setTimeout(()=>showNextDialog(),400);
  } else if(phase===1){
    if(dlgIdx<DIALOGS.length) showNextDialog();
    else showWin95();
  } else if(phase===2){
    // win95 is showing — handled by buttons
  } else if(phase===3){
    // title screen — launch Act II: The Vision
    launchActII();
  }
}

function showNextDialog(){
  if(dlgIdx>=DIALOGS.length){showWin95();return;}
  const d=DIALOGS[dlgIdx++];
  document.getElementById('dlg-spk').innerHTML=d.icon+' '+d.spk;
  document.getElementById('dlg-line').textContent=d.line;
  document.getElementById('nrk-dlg').style.display='block';
  tone(220,.04,'sawtooth',.08);
}

function showWin95(){
  phase=2;
  glitchSound();
  document.getElementById('win95').style.display='block';
}

document.getElementById('w95-ok').addEventListener('click',e=>{
  e.stopPropagation();
  document.getElementById('win95').style.display='none';
  phase=3;showTitle();
});
document.getElementById('w95-cancel').addEventListener('click',e=>{
  e.stopPropagation();
  document.getElementById('win95').style.display='none';
  phase=3;showTitle();
});

function showTitle(){
  showPhase('ph-title');
  setTimeout(titleSlam,100);
}

document.addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' '){e.preventDefault();if(phase!==2)advance();}
});
document.addEventListener('click',()=>{if(phase!==2)advance();});


function launchActII(){
  const overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;background:#000;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:VT323,monospace;opacity:0;transition:opacity .8s;';
  overlay.innerHTML=`
    <div style="color:#ff00cc;letter-spacing:.2em;font-size:clamp(12px,2vw,20px);margin-bottom:.5rem;">// ACT II</div>
    <div style="font-family:'Metal Mania',cursive;font-size:clamp(32px,8vw,96px);color:#fff;text-shadow:0 0 20px #ff00cc,0 0 40px #7a00ff;text-align:center;">THE VISION</div>
    <div style="color:#00f0ff;font-size:clamp(14px,2vw,22px);margin-top:.8rem;letter-spacing:.1em;">NRK SYNTHWAVE PROPHECY</div>
  `;
  document.body.appendChild(overlay);
  requestAnimationFrame(()=>{requestAnimationFrame(()=>{overlay.style.opacity='1';});});
  setTimeout(()=>{window.location.href='sierra-vision.html';},2500);
}

// Auto-advance from static after 1.8s
setTimeout(()=>{if(phase===0)advance();},1800);
</script>
</body>
</html>
