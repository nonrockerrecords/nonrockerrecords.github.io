<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pull Up a Chair — Camp Kanahoma</title>
    <link rel="stylesheet" href="assets/css/brand.css">
    <link rel="stylesheet" href="assets/css/chairs.css">
</head>
<body>

<section class="chairs-stage">
    <nav class="chairs-nav">
        <a href="index.html" class="nav-wordmark" aria-label="Kanahoma"><img src="assets/svg/Kanahoma_Logo_White.svg" alt=""></a>
        <a href="index.html">← Back to site</a>
    </nav>

    <div class="chairs-intro">
        <span class="chairs-eyebrow">★ Around the Campfire ★</span>
        <h1 class="chairs-headline">Pull up a chair. Hear a <span class="script">story.</span></h1>
        <p class="chairs-sub">Click a stump to listen in on what our partners say when no one's making them say it.</p>
    </div>

    <p class="scene-hint">↓ click any stump ↓</p>

    <!-- Campfire scene with clickable stumps -->
    <div class="scene">
        <svg viewBox="0 0 1100 700" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
                <radialGradient id="fireGlow2" cx="50%" cy="60%" r="50%">
                    <stop offset="0%"   stop-color="#C96E43" stop-opacity="0.75"/>
                    <stop offset="100%" stop-color="#C96E43" stop-opacity="0"/>
                </radialGradient>
            </defs>

            <!-- Sky / background -->
            <rect x="0" y="0" width="1100" height="700" fill="transparent"/>

            <!-- Distant mountains -->
            <path d="M0 280 L150 110 L300 220 L450 80 L600 200 L750 70 L900 210 L1100 100 L1100 700 L0 700 Z" fill="#162819" opacity=".6"/>
            <path d="M0 360 L180 200 L360 320 L540 180 L720 280 L900 160 L1100 290 L1100 700 L0 700 Z" fill="#1e3320" opacity=".8"/>

            <!-- Pine trees -->
            <g transform="translate(80, 420)"><polygon points="0,-160 -50,0 50,0" fill="#162819"/><polygon points="0,-110 -40,15 40,15" fill="#1a2e1e"/></g>
            <g transform="translate(160, 440)"><polygon points="0,-130 -42,0 42,0" fill="#1a2e1e"/><polygon points="0,-90 -32,12 32,12" fill="#1e3322"/></g>
            <g transform="translate(990, 415)"><polygon points="0,-170 -52,0 52,0" fill="#162819"/><polygon points="0,-115 -42,15 42,15" fill="#1a2e1e"/></g>
            <g transform="translate(1050, 445)"><polygon points="0,-120 -38,0 38,0" fill="#1a2e1e"/></g>

            <!-- Ground -->
            <ellipse cx="550" cy="600" rx="500" ry="80" fill="#2f4936" opacity=".7"/>

            <!-- Stumps (5 of them — 4 clickable, 1 unused for balance) -->
            <!-- Stump 1: left -->
            <g transform="translate(247, 462)">
                <ellipse cx="0" cy="42" rx="55" ry="18" fill="#4a2e18"/>
                <rect x="-55" y="-6" width="110" height="48" rx="4" fill="#5c3820"/>
                <ellipse cx="0" cy="-6" rx="55" ry="18" fill="#6e4428"/>
                <ellipse cx="0" cy="-6" rx="38" ry="12" fill="none" stroke="#5c3820" stroke-width="2" opacity=".5"/>
                <ellipse cx="0" cy="-6" rx="22" ry="7"  fill="none" stroke="#5c3820" stroke-width="1.5" opacity=".4"/>
                <ellipse cx="0" cy="-6" rx="8"  ry="3"  fill="none" stroke="#5c3820" stroke-width="1" opacity=".3"/>
            </g>
            <!-- Stump 2 -->
            <g transform="translate(445, 547)">
                <ellipse cx="0" cy="36" rx="50" ry="16" fill="#4a2e18"/>
                <rect x="-50" y="-4" width="100" height="42" rx="4" fill="#5c3820"/>
                <ellipse cx="0" cy="-4" rx="50" ry="16" fill="#6e4428"/>
                <ellipse cx="0" cy="-4" rx="34" ry="11" fill="none" stroke="#5c3820" stroke-width="2" opacity=".5"/>
                <ellipse cx="0" cy="-4" rx="18" ry="6"  fill="none" stroke="#5c3820" stroke-width="1.5" opacity=".4"/>
            </g>
            <!-- Stump 3 -->
            <g transform="translate(665, 547)">
                <ellipse cx="0" cy="36" rx="50" ry="16" fill="#4a2e18"/>
                <rect x="-50" y="-4" width="100" height="42" rx="4" fill="#5c3820"/>
                <ellipse cx="0" cy="-4" rx="50" ry="16" fill="#6e4428"/>
                <ellipse cx="0" cy="-4" rx="34" ry="11" fill="none" stroke="#5c3820" stroke-width="2" opacity=".5"/>
                <ellipse cx="0" cy="-4" rx="18" ry="6"  fill="none" stroke="#5c3820" stroke-width="1.5" opacity=".4"/>
            </g>
            <!-- Stump 4: right -->
            <g transform="translate(853, 462)">
                <ellipse cx="0" cy="42" rx="55" ry="18" fill="#4a2e18"/>
                <rect x="-55" y="-6" width="110" height="48" rx="4" fill="#5c3820"/>
                <ellipse cx="0" cy="-6" rx="55" ry="18" fill="#6e4428"/>
                <ellipse cx="0" cy="-6" rx="38" ry="12" fill="none" stroke="#5c3820" stroke-width="2" opacity=".5"/>
                <ellipse cx="0" cy="-6" rx="22" ry="7"  fill="none" stroke="#5c3820" stroke-width="1.5" opacity=".4"/>
                <ellipse cx="0" cy="-6" rx="8"  ry="3"  fill="none" stroke="#5c3820" stroke-width="1" opacity=".3"/>
            </g>

            <!-- Campfire (center) -->
            <ellipse class="fire-glow" cx="555" cy="510" rx="160" ry="70" fill="url(#fireGlow2)"/>
            <g transform="translate(555, 515)">
                <ellipse cx="0" cy="18" rx="90" ry="20" fill="#2a1a0a" opacity=".7"/>
                <rect x="-75" y="-10" width="68" height="22" rx="10" fill="#5c3010" transform="rotate(-22)"/>
                <rect x="10"  y="-10" width="68" height="22" rx="10" fill="#5c3010" transform="rotate( 22)"/>
                <rect x="-32" y="0" width="64" height="20" rx="10" fill="#6b3812"/>
                <circle cx="-15" cy="6" r="4" fill="#D9AB4D" opacity=".8"/>
                <circle cx="6" cy="3" r="3.5" fill="#C96E43" opacity=".9"/>
                <circle cx="20" cy="8" r="3" fill="#D9AB4D" opacity=".7"/>
            </g>
            <g transform="translate(555, 502)">
                <g class="flame">
                    <path d="M0 0 C-32,-40 -38,-90 0,-115 C 16,-78 32,-40 0,0" fill="#D9AB4D" opacity=".95"/>
                    <path d="M0 0 C 22,-32 36,-78 0,-105 C-12,-66 -22,-32 0,0" fill="#C96E43" opacity=".95"/>
                    <path d="M0 0 C -10,-26 -8,-62 0,-82 C  8,-62 12,-26 0,0" fill="#F6F2EE" opacity=".55"/>
                </g>
                <g class="flame-b" transform="translate(26,-8)">
                    <path d="M0 0 C-16,-28 -20,-58 0,-76 C 12,-46 16,-26 0,0" fill="#C96E43" opacity=".72"/>
                </g>
                <g class="flame-b" transform="translate(-26,-6)">
                    <path d="M0 0 C 11,-26 16,-48 0,-66 C-11,-40 -13,-22 0,0" fill="#D9AB4D" opacity=".72"/>
                </g>
            </g>

            <!-- Distant stars -->
            <circle cx="120"  cy="60" r="1.5" fill="#F6F2EE" opacity=".7"/>
            <circle cx="320"  cy="40" r="2"   fill="#F6F2EE" opacity=".5"/>
            <circle cx="540"  cy="30" r="1.5" fill="#F6F2EE" opacity=".7"/>
            <circle cx="780"  cy="50" r="2"   fill="#F6F2EE" opacity=".6"/>
            <circle cx="970"  cy="35" r="1.5" fill="#F6F2EE" opacity=".5"/>
        </svg>

        <!-- Overlaid clickable stumps -->
        <button class="stump-btn stump-1" data-i="0" aria-pressed="false"></button>
        <button class="stump-btn stump-2" data-i="1" aria-pressed="false"></button>
        <button class="stump-btn stump-3" data-i="2" aria-pressed="false"></button>
        <button class="stump-btn stump-4" data-i="3" aria-pressed="false"></button>
    </div>

    <!-- Testimonial card -->
    <article class="testimonial" id="testimonialCard" aria-live="polite">
        <p class="testimonial-quote"></p>
        <div class="testimonial-author">
            <div class="author-avatar"></div>
            <div class="author-meta">
                <strong></strong>
                <span></span>
            </div>
        </div>
        <div class="testimonial-result">
            <span class="arrow">★</span>
            <span class="testimonial-result-text"></span>
        </div>
    </article>
</section>

<script src="assets/js/chairs.js"></script>
</body>
</html>
