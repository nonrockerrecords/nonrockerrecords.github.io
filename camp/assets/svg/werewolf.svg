<svg viewBox="0 0 220 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="werewolfTitle werewolfDesc">
    <title id="werewolfTitle">Werewolf silhouette</title>
    <desc id="werewolfDesc">A dark upright werewolf silhouette with glowing eyes for the experimental flashlight page.</desc>
    <defs>
        <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%"   stop-color="#ff3322" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#ff3322" stop-opacity="0"/>
        </radialGradient>
    </defs>

    <!-- Body (hunched humanoid silhouette) -->
    <path d="M 110,60
             Q 145,62 152,90
             L 165,130
             Q 175,165 170,200
             L 162,240
             Q 158,265 150,275
             L 138,278
             Q 130,260 125,245
             Q 122,260 116,278
             L 100,278
             Q 96,260 100,245
             Q 92,260 88,278
             L 70,278
             Q 62,265 58,240
             L 50,200
             Q 45,165 55,130
             L 68,90
             Q 75,62 110,60 Z"
          fill="#080808"/>

    <!-- Arms raised with claws -->
    <!-- Left arm -->
    <path d="M 68,95
             Q 35,75 18,85
             Q 8,95 14,118
             L 22,142
             Q 30,148 38,138
             L 32,118
             L 56,118 Z"
          fill="#080808"/>
    <!-- Left claws -->
    <path d="M 14,128 L 4,148 M 20,135 L 14,158 M 28,138 L 26,162 M 36,138 L 38,160"
          stroke="#0a0a0a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Left fingertip glints -->
    <circle cx="4"  cy="148" r="1.5" fill="#3a1a1a"/>
    <circle cx="14" cy="158" r="1.5" fill="#3a1a1a"/>
    <circle cx="26" cy="162" r="1.5" fill="#3a1a1a"/>
    <circle cx="38" cy="160" r="1.5" fill="#3a1a1a"/>

    <!-- Right arm -->
    <path d="M 152,95
             Q 185,75 202,85
             Q 212,95 206,118
             L 198,142
             Q 190,148 182,138
             L 188,118
             L 164,118 Z"
          fill="#080808"/>
    <!-- Right claws -->
    <path d="M 206,128 L 216,148 M 200,135 L 206,158 M 192,138 L 194,162 M 184,138 L 182,160"
          stroke="#0a0a0a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="216" cy="148" r="1.5" fill="#3a1a1a"/>
    <circle cx="206" cy="158" r="1.5" fill="#3a1a1a"/>
    <circle cx="194" cy="162" r="1.5" fill="#3a1a1a"/>
    <circle cx="182" cy="160" r="1.5" fill="#3a1a1a"/>

    <!-- Chest fur tufts -->
    <path d="M 90,80 L 95,95 L 100,82 L 110,98 L 120,82 L 125,95 L 130,80"
          stroke="#1a1a1a" stroke-width="1.5" fill="none"/>

    <!-- Head silhouette -->
    <!-- Pointed ears -->
    <polygon points="78,22 70,2 92,18" fill="#080808"/>
    <polygon points="142,22 150,2 128,18" fill="#080808"/>

    <!-- Skull -->
    <ellipse cx="110" cy="42" rx="38" ry="32" fill="#080808"/>

    <!-- Snout extending down -->
    <path d="M 80,55
             L 70,75
             Q 75,90 90,92
             L 130,92
             Q 145,90 150,75
             L 140,55
             Z"
          fill="#080808"/>

    <!-- Lower jaw shadow -->
    <path d="M 82,82 Q 110,98 138,82 L 138,95 Q 110,108 82,95 Z" fill="#000"/>

    <!-- Snout ridges (subtle) -->
    <path d="M 95,68 L 105,70 M 115,70 L 125,68" stroke="#1a1a1a" stroke-width="1" opacity=".6"/>

    <!-- Nose -->
    <ellipse cx="110" cy="62" rx="4" ry="3" fill="#1a1a1a"/>

    <!-- Bright glowing eyes -->
    <!-- Outer glow -->
    <circle cx="88"  cy="42" r="14" fill="url(#eyeGlow)"/>
    <circle cx="132" cy="42" r="14" fill="url(#eyeGlow)"/>
    <!-- Eye whites/glow -->
    <ellipse cx="88"  cy="42" rx="8" ry="6" fill="#ff5530"/>
    <ellipse cx="132" cy="42" rx="8" ry="6" fill="#ff5530"/>
    <!-- Pupils -->
    <ellipse cx="88"  cy="43" rx="5" ry="4" fill="#ff1100"/>
    <ellipse cx="132" cy="43" rx="5" ry="4" fill="#ff1100"/>
    <!-- Slit pupils -->
    <ellipse cx="88"  cy="43" rx="1.2" ry="3.5" fill="#000"/>
    <ellipse cx="132" cy="43" rx="1.2" ry="3.5" fill="#000"/>
    <!-- Eye highlights -->
    <circle cx="90"  cy="40" r="1" fill="#fff" opacity=".8"/>
    <circle cx="134" cy="40" r="1" fill="#fff" opacity=".8"/>

    <!-- FANGS / bared teeth -->
    <!-- Upper fangs -->
    <polygon points="85,82 88,98 91,82" fill="#f0e8d8"/>
    <polygon points="129,82 132,98 135,82" fill="#f0e8d8"/>
    <!-- Smaller teeth -->
    <polygon points="96,84 98,94 100,84" fill="#e0d8c8"/>
    <polygon points="104,85 106,93 108,85" fill="#e0d8c8"/>
    <polygon points="112,85 114,93 116,85" fill="#e0d8c8"/>
    <polygon points="120,84 122,94 124,84" fill="#e0d8c8"/>
    <!-- Lower fangs visible -->
    <polygon points="88,98 90,93 92,98" fill="#d0c8b8"/>
    <polygon points="128,98 130,93 132,98" fill="#d0c8b8"/>

    <!-- Drool drips -->
    <ellipse cx="88"  cy="105" rx="1" ry="3" fill="#f0e8d8" opacity=".7"/>
    <ellipse cx="132" cy="105" rx="1" ry="3" fill="#f0e8d8" opacity=".7"/>

    <!-- Fur jagged edges on head -->
    <polygon points="75,30 65,42 78,38" fill="#080808"/>
    <polygon points="145,30 155,42 142,38" fill="#080808"/>
    <polygon points="105,8 110,18 115,8" fill="#080808"/>
</svg>
