<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <title>Camp Kanahoma creature symbol set</title>
    <desc>Reusable dark-forest silhouette symbols for the experimental Camp Kanahoma pages.</desc>
    <defs>
        <style>
            .creature-fill { fill: #0A1A10; }
            .creature-detail { fill: #1A2A18; }
            .creature-wood { fill: #3A2516; }
            .creature-line { stroke: #0A1A10; stroke-linecap: round; stroke-linejoin: round; }
        </style>
    </defs>

    <!-- Owl -->
    <symbol id="creature-owl" viewBox="0 0 120 140">
        <ellipse class="creature-fill" cx="60" cy="85" rx="38" ry="48"/>
        <ellipse class="creature-fill" cx="60" cy="45" rx="35" ry="32"/>
        <polygon class="creature-fill" points="38,22 32,8 45,18"/>
        <polygon class="creature-fill" points="82,22 88,8 75,18"/>
        <polygon points="55,52 60,60 65,52" fill="#3A2210"/>
        <path d="M 30,70 Q 22,95 35,118" stroke="#1a2a18" stroke-width="2" fill="none"/>
        <path d="M 90,70 Q 98,95 85,118" stroke="#1a2a18" stroke-width="2" fill="none"/>
        <rect class="creature-wood" x="-5" y="125" width="130" height="6"/>
        <circle cx="48" cy="44" r="9" fill="#000"/>
        <circle cx="72" cy="44" r="9" fill="#000"/>
    </symbol>

    <!-- Masked forest creature -->
    <symbol id="creature-raccoon" viewBox="0 0 160 100">
        <ellipse class="creature-fill" cx="80" cy="70" rx="55" ry="25"/>
        <ellipse class="creature-fill" cx="80" cy="40" rx="32" ry="28"/>
        <polygon class="creature-fill" points="55,22 50,10 65,20"/>
        <polygon class="creature-fill" points="105,22 110,10 95,20"/>
        <ellipse class="creature-detail" cx="80" cy="52" rx="10" ry="6"/>
        <circle cx="80" cy="50" r="3" fill="#000"/>
        <path class="creature-fill" d="M 135,70 Q 158,60 160,40 Q 158,30 150,32"/>
        <rect class="creature-detail" x="138" y="55" width="22" height="3" transform="rotate(-15 138 55)"/>
        <rect class="creature-detail" x="148" y="42" width="14" height="3" transform="rotate(-25 148 42)"/>
        <ellipse cx="80" cy="38" rx="22" ry="8" fill="#000"/>
        <rect class="creature-fill" x="55" y="85" width="6" height="14" rx="2"/>
        <rect class="creature-fill" x="100" y="85" width="6" height="14" rx="2"/>
    </symbol>

    <!-- FOX -->
    <symbol id="creature-fox" viewBox="0 0 160 110">
        <ellipse class="creature-fill" cx="75" cy="65" rx="48" ry="22"/>
        <path class="creature-fill" d="M 30,55 L 50,30 L 65,40 L 80,30 L 90,55 Q 75,70 50,68 Q 35,65 30,55 Z"/>
        <polygon class="creature-fill" points="45,32 38,10 55,28"/>
        <polygon class="creature-fill" points="75,32 82,10 65,28"/>
        <polygon class="creature-fill" points="50,52 35,68 50,62"/>
        <circle cx="36" cy="64" r="2.5" fill="#000"/>
        <path class="creature-fill" d="M 118,68 Q 145,68 152,40 Q 156,30 148,28 Q 140,40 130,55 Q 118,60 118,68 Z"/>
        <ellipse class="creature-detail" cx="151" cy="32" rx="6" ry="4"/>
        <rect class="creature-fill" x="55" y="80" width="5" height="14" rx="2"/>
        <rect class="creature-fill" x="95" y="80" width="5" height="14" rx="2"/>
        <rect class="creature-fill" x="70" y="80" width="5" height="14" rx="2"/>
        <rect class="creature-fill" x="108" y="80" width="5" height="14" rx="2"/>
    </symbol>

    <!-- BEAR -->
    <symbol id="creature-bear" viewBox="0 0 200 160">
        <!-- Body -->
        <ellipse cx="100" cy="100" rx="80" ry="50" fill="#0a1a10"/>
        <!-- Head -->
        <ellipse cx="100" cy="55" rx="48" ry="40" fill="#0a1a10"/>
        <!-- Rounded ears -->
        <circle cx="70" cy="22" r="14" fill="#0a1a10"/>
        <circle cx="130" cy="22" r="14" fill="#0a1a10"/>
        <!-- Snout -->
        <ellipse cx="100" cy="72" rx="18" ry="13" fill="#1a2a18"/>
        <!-- Nose -->
        <ellipse cx="100" cy="68" rx="5" ry="4" fill="#000"/>
        <!-- Mouth line -->
        <path d="M 100,75 L 100,80 L 92,82 M 100,80 L 108,82" stroke="#000" stroke-width="2" fill="none" stroke-linecap="round"/>
        <!-- Legs -->
        <rect x="50" y="135" width="18" height="22" rx="3" fill="#0a1a10"/>
        <rect x="135" y="135" width="18" height="22" rx="3" fill="#0a1a10"/>
        <!-- Claw hints -->
        <path d="M 55,156 L 52,160 M 60,156 L 60,160 M 65,156 L 68,160" stroke="#000" stroke-width="1.5"/>
        <path d="M 140,156 L 137,160 M 145,156 L 145,160 M 150,156 L 153,160" stroke="#000" stroke-width="1.5"/>
    </symbol>

    <!-- DEER -->
    <symbol id="creature-deer" viewBox="0 0 160 200">
        <!-- Antlers -->
        <path d="M 65,35 L 50,12 L 55,20 L 42,15 L 50,25 L 38,28 L 48,32 M 65,35 L 60,18 M 70,30 L 75,10"
              stroke="#0a1a10" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M 95,35 L 110,12 L 105,20 L 118,15 L 110,25 L 122,28 L 112,32 M 95,35 L 100,18 M 90,30 L 85,10"
              stroke="#0a1a10" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <!-- Head -->
        <ellipse cx="80" cy="50" rx="22" ry="28" fill="#0a1a10"/>
        <!-- Ears -->
        <ellipse cx="62" cy="38" rx="6" ry="10" transform="rotate(-25 62 38)" fill="#0a1a10"/>
        <ellipse cx="98" cy="38" rx="6" ry="10" transform="rotate(25 98 38)" fill="#0a1a10"/>
        <!-- Snout/nose -->
        <ellipse cx="80" cy="72" rx="8" ry="5" fill="#1a2a18"/>
        <circle cx="80" cy="71" r="2.5" fill="#000"/>
        <!-- Neck -->
        <path d="M 70,75 L 65,110 L 92,110 L 90,75 Z" fill="#0a1a10"/>
        <!-- Body -->
        <ellipse cx="80" cy="135" rx="38" ry="22" fill="#0a1a10"/>
        <!-- Legs (skinny) -->
        <rect x="55" y="150" width="4" height="40" rx="2" fill="#0a1a10"/>
        <rect x="68" y="150" width="4" height="40" rx="2" fill="#0a1a10"/>
        <rect x="92" y="150" width="4" height="40" rx="2" fill="#0a1a10"/>
        <rect x="105" y="150" width="4" height="40" rx="2" fill="#0a1a10"/>
        <!-- Tail -->
        <ellipse cx="116" cy="128" rx="4" ry="8" fill="#0a1a10"/>
    </symbol>

    <!-- Distant campfire -->
    <symbol id="creature-fire" viewBox="0 0 100 100">
        <!-- Glow -->
        <ellipse class="easter-fire-glow" cx="50" cy="70" rx="40" ry="18"/>
        <!-- Logs -->
        <rect x="20" y="68" width="32" height="6" rx="3" fill="#3a1f0a" transform="rotate(-15 36 71)"/>
        <rect x="48" y="68" width="32" height="6" rx="3" fill="#3a1f0a" transform="rotate(15 64 71)"/>
        <rect x="32" y="74" width="36" height="5" rx="2.5" fill="#4a2810"/>
        <!-- Embers -->
        <circle cx="42" cy="76" r="1.5" fill="#D9AB4D" opacity=".8"/>
        <circle cx="58" cy="74" r="1.5" fill="#C96E43" opacity=".9"/>
        <!-- Flames -->
        <g class="easter-fire-flame">
            <path d="M 50,72 C 38,52 35,32 50,18 C 58,38 62,55 50,72" fill="#D9AB4D" opacity=".95"/>
            <path d="M 50,72 C 60,55 65,38 50,22 C 44,40 38,55 50,72" fill="#C96E43" opacity=".9"/>
            <path d="M 50,72 C 45,55 48,38 50,28 C 53,38 55,55 50,72" fill="#F6F2EE" opacity=".5"/>
        </g>
    </symbol>
</svg>
