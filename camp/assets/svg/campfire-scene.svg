<svg viewBox="0 0 1440 520" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="campfireTitle campfireDesc">
    <title id="campfireTitle">Camp Kanahoma campfire scene</title>
    <desc id="campfireDesc">A layered mountain night scene with pine trees, tree stumps, stars, and a warm animated campfire.</desc>
    <defs>
        <radialGradient id="fireGlow" cx="50%" cy="60%" r="50%">
            <stop offset="0%"   stop-color="#C96E43" stop-opacity="0.65"/>
            <stop offset="100%" stop-color="#C96E43" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="emberGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%"   stop-color="#D9AB4D" stop-opacity="0.4"/>
            <stop offset="100%" stop-color="#D9AB4D" stop-opacity="0"/>
        </radialGradient>
        <style>
            .flame   { animation: flicker  .85s ease-in-out infinite alternate; transform-origin: 50% 100%; transform-box: fill-box; }
            .flame-b { animation: flickerB .6s  ease-in-out infinite alternate; transform-origin: 50% 100%; transform-box: fill-box; }
            .fire-glow { animation: glow 1.6s ease-in-out infinite alternate; transform-origin: center; transform-box: fill-box; }
            .stars-layer { animation: twinkle 4s ease-in-out infinite alternate; }
            @keyframes flicker  { from {transform:scaleX(1)   scaleY(1)   rotate(-1deg); opacity:1;}   to {transform:scaleX(.88) scaleY(1.08) rotate(1deg);  opacity:.88;} }
            @keyframes flickerB { from {transform:scaleX(.85) scaleY(.9)  rotate(1.5deg);opacity:.75;} to {transform:scaleX(1.05)scaleY(1.12)rotate(-1.5deg);opacity:1;} }
            @keyframes glow     { from {opacity:.35; transform:scale(1);}   to {opacity:.55; transform:scale(1.12);} }
            @keyframes twinkle  { from {opacity:.5;}  to {opacity:1;} }
        </style>
    </defs>

    <!-- Stars -->
    <g class="stars-layer">
        <circle cx="80"   cy="28"  r="1.5" fill="#F6F2EE" opacity=".6"/>
        <circle cx="220"  cy="16"  r="1"   fill="#F6F2EE" opacity=".45"/>
        <circle cx="390"  cy="38"  r="1.5" fill="#F6F2EE" opacity=".7"/>
        <circle cx="560"  cy="12"  r="1"   fill="#F6F2EE" opacity=".5"/>
        <circle cx="720"  cy="22"  r="2"   fill="#F6F2EE" opacity=".4"/>
        <circle cx="900"  cy="32"  r="1.5" fill="#F6F2EE" opacity=".65"/>
        <circle cx="1080" cy="14"  r="1"   fill="#F6F2EE" opacity=".5"/>
        <circle cx="1260" cy="40"  r="1.5" fill="#F6F2EE" opacity=".7"/>
        <circle cx="170"  cy="64"  r="1"   fill="#F6F2EE" opacity=".35"/>
        <circle cx="470"  cy="50"  r="1.5" fill="#F6F2EE" opacity=".55"/>
        <circle cx="740"  cy="58"  r="1"   fill="#F6F2EE" opacity=".4"/>
        <circle cx="1100" cy="46"  r="1.5" fill="#F6F2EE" opacity=".6"/>
        <circle cx="1380" cy="24"  r="1"   fill="#F6F2EE" opacity=".5"/>
        <circle cx="310"  cy="80"  r="1"   fill="#F6F2EE" opacity=".3"/>
        <circle cx="650"  cy="72"  r="1.5" fill="#F6F2EE" opacity=".45"/>
        <circle cx="990"  cy="68"  r="1"   fill="#F6F2EE" opacity=".4"/>
        <circle cx="1340" cy="76"  r="1.5" fill="#F6F2EE" opacity=".55"/>
    </g>

    <!-- Mountain layers -->
    <path d="M0 320 L160 110 L320 240 L480 90 L640 200 L800 70 L960 210 L1120 95 L1280 230 L1440 100 L1440 520 L0 520 Z" fill="#162819"/>
    <path d="M0 370 L200 170 L380 300 L560 150 L720 260 L900 130 L1080 275 L1280 155 L1440 280 L1440 520 L0 520 Z" fill="#1e3320"/>
    <path d="M0 420 L240 210 L420 340 L600 200 L780 330 L960 185 L1140 315 L1320 210 L1440 330 L1440 520 L0 520 Z" fill="#263d2c"/>

    <!-- Ground -->
    <rect x="0" y="462" width="1440" height="58" fill="#2f4936"/>

    <!-- Pine trees left -->
    <g transform="translate(60,350)"><rect x="-7" y="0" width="14" height="36" fill="#4a3020"/><polygon points="0,-95 -38,0 38,0" fill="#162819"/><polygon points="0,-65 -30,10 30,10" fill="#1a2e1e"/></g>
    <g transform="translate(130,368)"><rect x="-6" y="0" width="12" height="30" fill="#4a3020"/><polygon points="0,-80 -32,0 32,0" fill="#1a2e1e"/><polygon points="0,-54 -25,8 25,8" fill="#1e3322"/></g>
    <g transform="translate(185,382)"><rect x="-5" y="0" width="10" height="26" fill="#4a3020"/><polygon points="0,-65 -26,0 26,0" fill="#162819"/><polygon points="0,-44 -20,7 20,7" fill="#1a2e1e"/></g>

    <!-- Pine trees right -->
    <g transform="translate(1260,345)"><rect x="-7" y="0" width="14" height="36" fill="#4a3020"/><polygon points="0,-95 -38,0 38,0" fill="#162819"/><polygon points="0,-65 -30,10 30,10" fill="#1a2e1e"/></g>
    <g transform="translate(1320,365)"><rect x="-6" y="0" width="12" height="30" fill="#4a3020"/><polygon points="0,-80 -32,0 32,0" fill="#1a2e1e"/><polygon points="0,-54 -25,8 25,8" fill="#1e3322"/></g>
    <g transform="translate(1380,380)"><rect x="-5" y="0" width="10" height="26" fill="#4a3020"/><polygon points="0,-65 -26,0 26,0" fill="#162819"/><polygon points="0,-44 -20,7 20,7" fill="#1a2e1e"/></g>

    <!-- Tree stumps left -->
    <g transform="translate(280,440)">
        <ellipse cx="0" cy="28" rx="30" ry="10" fill="#4a2e18"/>
        <rect x="-30" y="-4" width="60" height="32" rx="3" fill="#5c3820"/>
        <ellipse cx="0" cy="-4" rx="30" ry="10" fill="#6e4428"/>
        <ellipse cx="0" cy="-4" rx="21" ry="7" fill="none" stroke="#5c3820" stroke-width="1.2" opacity=".5"/>
        <ellipse cx="0" cy="-4" rx="12" ry="4" fill="none" stroke="#5c3820" stroke-width="1" opacity=".4"/>
    </g>
    <g transform="translate(360,452)">
        <ellipse cx="0" cy="22" rx="24" ry="8" fill="#4a2e18"/>
        <rect x="-24" y="-3" width="48" height="25" rx="2" fill="#5c3820"/>
        <ellipse cx="0" cy="-3" rx="24" ry="8" fill="#6e4428"/>
        <ellipse cx="0" cy="-3" rx="17" ry="5.5" fill="none" stroke="#5c3820" stroke-width="1" opacity=".5"/>
    </g>
    <g transform="translate(430,458)">
        <ellipse cx="0" cy="18" rx="20" ry="7" fill="#4a2e18"/>
        <rect x="-20" y="-3" width="40" height="21" rx="2" fill="#5c3820"/>
        <ellipse cx="0" cy="-3" rx="20" ry="7" fill="#6e4428"/>
    </g>

    <!-- Tree stumps right -->
    <g transform="translate(1010,448)">
        <ellipse cx="0" cy="20" rx="22" ry="7" fill="#4a2e18"/>
        <rect x="-22" y="-3" width="44" height="23" rx="2" fill="#5c3820"/>
        <ellipse cx="0" cy="-3" rx="22" ry="7" fill="#6e4428"/>
        <ellipse cx="0" cy="-3" rx="15" ry="5" fill="none" stroke="#5c3820" stroke-width="1" opacity=".45"/>
    </g>
    <g transform="translate(1090,440)">
        <ellipse cx="0" cy="28" rx="30" ry="10" fill="#4a2e18"/>
        <rect x="-30" y="-4" width="60" height="32" rx="3" fill="#5c3820"/>
        <ellipse cx="0" cy="-4" rx="30" ry="10" fill="#6e4428"/>
        <ellipse cx="0" cy="-4" rx="21" ry="7" fill="none" stroke="#5c3820" stroke-width="1.2" opacity=".5"/>
        <ellipse cx="0" cy="-4" rx="12" ry="4" fill="none" stroke="#5c3820" stroke-width="1" opacity=".4"/>
    </g>
    <g transform="translate(1165,454)">
        <ellipse cx="0" cy="20" rx="22" ry="7" fill="#4a2e18"/>
        <rect x="-22" y="-3" width="44" height="23" rx="2" fill="#5c3820"/>
        <ellipse cx="0" cy="-3" rx="22" ry="7" fill="#6e4428"/>
    </g>

    <!-- Campfire glow -->
    <ellipse class="fire-glow" cx="720" cy="462" rx="90" ry="42" fill="url(#fireGlow)"/>
    <ellipse cx="720" cy="466" rx="55" ry="20" fill="url(#emberGlow)" opacity=".5"/>

    <!-- Logs -->
    <g transform="translate(720,464)">
        <ellipse cx="0" cy="10" rx="55" ry="12" fill="#2a1a0a" opacity=".6"/>
        <rect x="-46" y="-6" width="40" height="14" rx="6" fill="#5c3010" transform="rotate(-22)"/>
        <rect x="6"   y="-6" width="40" height="14" rx="6" fill="#5c3010" transform="rotate( 22)"/>
        <rect x="-20" y="0"  width="40" height="12" rx="6" fill="#6b3812"/>
        <circle cx="-8" cy="2" r="2.5" fill="#D9AB4D" opacity=".8"/>
        <circle cx=" 4" cy="0" r="2"   fill="#C96E43" opacity=".9"/>
        <circle cx="12" cy="3" r="2"   fill="#D9AB4D" opacity=".7"/>
    </g>

    <!-- Flames -->
    <g transform="translate(720,460)">
        <g class="flame">
            <path d="M0 0 C-18,-22 -22,-50 0,-64 C 9,-42 18,-22 0, 0" fill="#D9AB4D" opacity=".95"/>
            <path d="M0 0 C 12,-18 20,-44 0,-58 C-7,-36 -12,-18 0, 0" fill="#C96E43" opacity=".95"/>
            <path d="M0 0 C -6,-14 -4,-34 0,-46 C  4,-34   6,-14 0, 0" fill="#F6F2EE" opacity=".55"/>
        </g>
        <g class="flame-b" transform="translate(14,-4)">
            <path d="M0 0 C-9,-16 -11,-32 0,-42 C 7,-26 9,-14 0,0" fill="#C96E43" opacity=".72"/>
        </g>
        <g class="flame-b" transform="translate(-14,-2)">
            <path d="M0 0 C 6,-14 9,-26 0,-36 C-6,-22 -7,-12 0,0" fill="#D9AB4D" opacity=".72"/>
        </g>
        <g class="flame" transform="translate(-6,-10) scale(.65)">
            <path d="M0 0 C-10,-14 -12,-28 0,-38 C 8,-22 10,-12 0,0" fill="#D9AB4D" opacity=".6"/>
        </g>
    </g>
</svg>
