<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>NRK — THE VISION</title>
<link href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet"/>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;cursor:none;}

  /* CRT + vignette */
  body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(to bottom,transparent 0,transparent 2px,rgba(0,0,0,.12) 3px,transparent 4px);pointer-events:none;z-index:9900;}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 35%,rgba(0,0,0,.88) 100%);pointer-events:none;z-index:9800;}

  #stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;}

  /* ── SCENE ── */
  .scene-wrap{
    position:relative;
    width:min(98vw,calc(88vh*1.5));
    flex-shrink:0;
  }

  /* The pixel art image — characters looking into crystal ball */
  .scene-img{
    display:block;width:100%;
    image-rendering:pixelated;
    position:relative;z-index:2;
  }

  /* CRYSTAL BALL overlay — sits centered over image */
  #crystal-ball{
    position:absolute;
    width:22%;aspect-ratio:1;
    border-radius:50%;
    /* Center-bottom area where they'd be looking at something */
    left:38%;top:42%;
    transform:translate(-50%,-50%);
    z-index:10;
    overflow:hidden;
    box-shadow:
      0 0 20px rgba(255,0,204,.8),
      0 0 60px rgba(122,0,255,.6),
      0 0 120px rgba(0,240,255,.4),
      inset 0 0 20px rgba(255,255,255,.15);
    border:2px solid rgba(255,255,255,.4);
  }
  #ball-canvas{width:100%;height:100%;display:block;border-radius:50%;}

  /* SHOCK BURST behind characters */
  #shock{
    position:absolute;inset:0;z-index:1;pointer-events:none;
    opacity:0;
    background:radial-gradient(ellipse at 50% 60%,rgba(255,0,204,.35) 0%,rgba(122,0,255,.2) 35%,transparent 65%);
    animation:shockPulse 2s ease-in-out infinite;
  }
  @keyframes shockPulse{0%,100%{opacity:0}50%{opacity:1}}

  /* SURPRISE LINES — pixel art manga-style */
  .surprise-line{
    position:absolute;
    width:2px;
    background:linear-gradient(to top,#ff00cc,transparent);
    transform-origin:bottom center;
    border-radius:1px;
    animation:linePop .4s cubic-bezier(.17,.67,.41,1.5) both;
    z-index:15;
  }
  @keyframes linePop{0%{height:0;opacity:0}100%{opacity:1}}

  /* VISION TEXT inside ball — the synthwave future */
  #vision-text{
    position:absolute;inset:0;border-radius:50%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    z-index:12;pointer-events:none;
    text-align:center;padding:8%;
  }
  .vt-line{
    font-family:'Press Start 2P',monospace;
    font-size:clamp(4px,.7vw,7px);
    color:#fff;letter-spacing:.04em;line-height:1.5;
    text-shadow:0 0 6px #ff00cc,0 0 12px rgba(255,0,204,.5);
    opacity:0;
    animation:textFade .5s ease forwards;
  }
  @keyframes textFade{to{opacity:1}}

  /* ── EXCLAMATION POPUPS ── */
  .exclaim{
    position:absolute;
    font-family:'Press Start 2P',monospace;
    font-size:clamp(8px,1.4vw,14px);
    color:#ffff00;
    text-shadow:0 0 12px #ffff00,1px 1px 0 #884400;
    z-index:20;pointer-events:none;
    opacity:0;
    animation:excPop .4s cubic-bezier(.17,.67,.41,2) .8s forwards;
  }
  @keyframes excPop{0%{transform:scale(0) rotate(-10deg);opacity:0}80%{transform:scale(1.2) rotate(5deg);opacity:1}100%{transform:scale(1) rotate(0deg);opacity:1}}

  /* ── CAPTION BAR ── */
  #caption{
    width:min(98vw,calc(88vh*1.5));
    background:#000;
    border:2px solid #ff00cc;
    box-shadow:0 0 20px rgba(255,0,204,.35);
    padding:.5em 1em;
    margin-top:6px;
    position:relative;z-index:100;
  }
  .cap-speaker{
    font-family:'Press Start 2P',monospace;
    font-size:clamp(5px,.85vw,9px);
    color:#ff00cc;letter-spacing:.14em;
    text-shadow:0 0 8px #ff00cc;margin-bottom:.3em;
  }
  .cap-text{
    font-family:'VT323',monospace;
    font-size:clamp(15px,2.4vw,26px);
    color:#f4eaff;letter-spacing:.04em;line-height:1.35;
  }
  .cap-next{
    position:absolute;bottom:.35em;right:.8em;
    font-family:'Press Start 2P',monospace;
    font-size:clamp(4px,.7vw,7px);
    color:rgba(255,0,204,.45);letter-spacing:.1em;
    animation:blink .9s step-end infinite;
  }
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

  /* ── TITLE CARD ── */
  #ph-title{
    position:fixed;inset:0;z-index:500;
    background:rgba(0,0,0,.95);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .tc-eyebrow{
    font-family:'Press Start 2P',monospace;
    font-size:clamp(5px,.9vw,9px);
    color:rgba(255,0,204,.5);letter-spacing:.25em;margin-bottom:1.4em;
  }
  .tc-main{
    font-family:'Metal Mania',serif;
    font-size:clamp(32px,8vw,88px);
    color:#ff00cc;
    text-shadow:0 0 40px #ff00cc,0 0 100px rgba(255,0,204,.3),4px 4px 0 #7a00ff;
    letter-spacing:.08em;text-align:center;line-height:1;
    animation:titleIn .4s cubic-bezier(.17,.67,.41,1.4);
  }
  @keyframes titleIn{0%{transform:scale(1.6);opacity:0}100%{transform:scale(1);opacity:1}}
  .tc-sub{
    font-family:'VT323',monospace;
    font-size:clamp(18px,3.5vw,38px);
    color:#00f0ff;letter-spacing:.18em;
    text-shadow:0 0 14px #00f0ff;margin-top:.5em;text-align:center;
  }
  .tc-press{
    font-family:'Press Start 2P',monospace;
    font-size:clamp(5px,.9vw,9px);
    color:rgba(255,255,255,.35);letter-spacing:.18em;
    margin-top:2.5em;
    animation:blink 1.1s step-end infinite;
  }
  .tc-catalog{
    font-family:'Press Start 2P',monospace;
    font-size:clamp(4px,.7vw,8px);
    color:#7a00ff;letter-spacing:.2em;
    border:1px solid rgba(122,0,255,.4);
    padding:.3em 1.2em;margin-top:1.4em;
  }
</style>
</head>
<body>

<div id="stage">
  <div class="scene-wrap" id="scene-wrap">
    <!-- shock glow behind -->
    <div id="shock"></div>
    <!-- the pixel art image -->
    <img class="scene-img" src="sierra-scene.png" alt="NRK crew gazing into crystal ball"/>
    <!-- crystal ball overlay -->
    <div id="crystal-ball">
      <canvas id="ball-canvas"></canvas>
      <div id="vision-text"></div>
    </div>
    <!-- exclamation marks over characters -->
    <div class="exclaim" id="ex1" style="left:6%;top:6%;">!</div>
    <div style="position:absolute;left:3%;top:88%;font-family:'VT323',monospace;font-size:clamp(10px,1.4vw,14px);color:#ff00cc;letter-spacing:.05em;opacity:.7;">YUNG SOJU</div>
    <div class="exclaim" id="ex2" style="left:40%;top:4%;animation-delay:.7s;">!!</div>
    <div style="position:absolute;left:33%;top:88%;font-family:'VT323',monospace;font-size:clamp(10px,1.4vw,14px);color:#00f0ff;letter-spacing:.05em;opacity:.7;">NULLSOFT</div>
    <div class="exclaim" id="ex3" style="left:68%;top:6%;animation-delay:1.1s;">!</div>
    <div style="position:absolute;left:65%;top:88%;font-family:'VT323',monospace;font-size:clamp(10px,1.4vw,14px);color:#39ff14;letter-spacing:.05em;opacity:.7;">KAZOO_HAWK</div>
    <!-- surprise lines (pixel manga style) -->
  </div>
  <!-- caption dialog -->
  <div id="caption">
    <div class="cap-speaker" id="cap-spk"></div>
    <div class="cap-text" id="cap-txt"></div>
    <div class="cap-next">&#9654; click / any key</div>
  </div>
</div>

<!-- TITLE CARD (shown last) -->
<div id="ph-title" style="display:none;">
  <div class="tc-eyebrow">nonrocker records presents</div>
  <div class="tc-main">THE VISION</div>
  <div class="tc-sub">NRK SYNTHWAVE PROPHECY</div>
  <div class="tc-catalog">NRK-ADV-VISION &nbsp;&#183;&nbsp; NRK-2024</div>
  <div class="tc-press">press any key to enter the EPK</div>
</div>

<script>
// AUDIO
let actx=null;
function initA(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();}
function tone(f,d,type='sine',v=0.12,t=0){initA();const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,actx.currentTime+t);g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+t+d);o.connect(g);g.connect(actx.destination);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+d+.01);}
function mysteryChord(){[130,164,196,261,329].forEach((f,i)=>tone(f,.6,'sine',.1,i*.04));tone(65,.8,'sine',.14,.0);}
function shockSound(){[880,440,220,110].forEach((f,i)=>tone(f,.06,'sawtooth',.12,i*.04));}

// CRYSTAL BALL CANVAS — synthwave portal
const ballCv=document.getElementById('ball-canvas');
const bcx=ballCv.getContext('2d');
let bT=0,bW=0,bH=0;
function resizeBall(){bW=ballCv.width=ballCv.offsetWidth;bH=ballCv.height=ballCv.offsetHeight;}
function drawBall(){
  resizeBall();
  // Deep space bg
  const bg=bcx.createRadialGradient(bW/2,bH/2,0,bW/2,bH/2,bW/2);
  bg.addColorStop(0,'#1a0030');bg.addColorStop(.5,'#06001a');bg.addColorStop(1,'#000');
  bcx.fillStyle=bg;bcx.fillRect(0,0,bW,bH);

  // Synthwave grid lines
  bcx.save();
  const horizon=bH*.52;
  // Horizontal lines (perspective)
  for(let i=0;i<10;i++){
    const y=horizon+((i/10)*bH*.48);
    const t2=i/10;
    const alpha=0.15+t2*.3;
    bcx.strokeStyle=`rgba(255,0,204,${alpha})`;
    bcx.lineWidth=.8;
    bcx.beginPath();bcx.moveTo(0,y);bcx.lineTo(bW,y);bcx.stroke();
  }
  // Vertical lines (converge to horizon center)
  for(let i=-6;i<=6;i++){
    const spread=i/6;
    bcx.strokeStyle='rgba(122,0,255,.2)';
    bcx.lineWidth=.6;
    bcx.beginPath();bcx.moveTo(bW/2+spread*bW*.6,horizon);bcx.lineTo(bW/2+spread*bW*.5,bH);bcx.stroke();
  }
  // Moving grid offset
  const off=(bT*.4)%((bH*.48)/10);
  for(let i=0;i<12;i++){
    const y=horizon+off+(i/10)*bH*.48;
    if(y>bH)continue;
    const t2=(y-horizon)/(bH-horizon);
    bcx.strokeStyle=`rgba(0,240,255,${t2*.25})`;
    bcx.lineWidth=.5;
    bcx.beginPath();bcx.moveTo(0,y);bcx.lineTo(bW,y);bcx.stroke();
  }
  bcx.restore();

  // Sun on horizon
  const sg=bcx.createLinearGradient(0,horizon-bH*.12,0,horizon);
  sg.addColorStop(0,'rgba(255,0,204,.7)');sg.addColorStop(.5,'rgba(255,90,0,.5)');sg.addColorStop(1,'rgba(255,184,0,.3)');
  bcx.fillStyle=sg;
  bcx.beginPath();bcx.ellipse(bW/2,horizon,bW*.32,bH*.14,0,Math.PI,0);bcx.fill();
  // Horizon stripe cuts
  for(let i=0;i<4;i++){const sy=horizon-(bH*.01+i*bH*.025);bcx.fillStyle='#000';bcx.fillRect(0,sy,bW,bH*.012);}

  // Stars
  for(let i=0;i<30;i++){
    const sx=((i*137.5)%bW),sy=((i*71.3)%horizon*.8);
    const a=.4+.4*Math.sin(bT*.03+i);
    bcx.fillStyle=`rgba(255,255,255,${a})`;
    bcx.fillRect(sx,sy,1,1);
  }

  // Shimmer highlight
  const shine=bcx.createRadialGradient(bW*.3,bH*.25,0,bW*.3,bH*.25,bW*.3);
  shine.addColorStop(0,'rgba(255,255,255,.18)');shine.addColorStop(1,'rgba(255,255,255,0)');
  bcx.fillStyle=shine;bcx.beginPath();bcx.arc(bW/2,bH/2,bW/2,0,6.28);bcx.fill();

  bT++;
}

// Vision text inside ball — appears in sequence
const VISIONS=[
  ['PRIMAVERA 2025','SOLD OUT','NRK-2024','#1'],
  ['KAZOO','OVERDRIVE','IS THE','FUTURE'],
  ['SOJU','PROTOCOL','ACTIVATED','NRK-666'],
];
let visionIdx=0;
function showVision(){
  const vt=document.getElementById('vision-text');
  vt.innerHTML='';
  const v=VISIONS[visionIdx%VISIONS.length];visionIdx++;
  v.forEach((line,i)=>{
    const d=document.createElement('div');d.className='vt-line';
    d.style.animationDelay=(i*.1)+'s';d.textContent=line;vt.appendChild(d);
  });
}

// DIALOGS
const DIALOGS=[
  {spk:'YUNG SOJU',txt:'[stares in silence. The beanie does not move.]'},
  {spk:'NULLSOFT',txt:'"...the crystal ball is showing NRK-2024 at number one. The hat gem is GLOWING."'},
  {spk:'KAZOO_HAWK',txt:'"The crystal ball never lies. NRK-2024 goes to number one. The goose was always a metaphor."'},
  {spk:'KAZOO_HAWK',txt:'"The crystal ball never lies. NRK-2024 goes to number one. The goose was always a metaphor."'},
  {spk:'YUNG SOJU',txt:'"That kazoo in the vision... it\'s the size of a didgeridoo."'},
  {spk:'ALL THREE',txt:'"...we\'re gonna need a bigger soju bottle."'},
];
let dlgIdx=0,phase=0;

function showNextDialog(){
  if(dlgIdx>=DIALOGS.length){showTitle();return;}
  const d=DIALOGS[dlgIdx++];
  document.getElementById('cap-spk').textContent=d.spk;
  document.getElementById('cap-txt').textContent=d.txt;
  tone(330,.05,'triangle',.08);
  if(dlgIdx===1){
    // First dialog — trigger shock effects
    shockSound();
    setTimeout(addSurpriseLines,200);
    setTimeout(showVision,400);
    setTimeout(mysteryChord,600);
  }
  if(dlgIdx%2===0) showVision();
}

function addSurpriseLines(){
  const wrap=document.getElementById('scene-wrap');
  const positions=[[12,60,'-30deg'],[48,70,'0deg'],[68,55,'25deg'],[25,45,'-15deg'],[55,40,'10deg']];
  positions.forEach(([lp,tp,rot],i)=>{
    const l=document.createElement('div');l.className='surprise-line';
    l.style.left=lp+'%';l.style.top=(tp-20)+'%';
    l.style.transform='rotate('+rot+')';
    l.style.height=clamp(12,20)+'px';
    l.style.animationDelay=(i*.05)+'s';
    wrap.appendChild(l);
  });
}
function clamp(a,b){return a+Math.random()*(b-a)|0;}

function showTitle(){
  phase=2;
  document.getElementById('ph-title').style.display='flex';
  setTimeout(()=>{[523,659,784,1047,1318].forEach((f,i)=>tone(f,.28,'sine',.18,i*.12));},200);
}

function advance(){
  initA();
  if(phase===0){showNextDialog();}
  else if(phase===2){window.location.href='epk-arcade.html';}
}

document.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();advance();}});
document.addEventListener('click',()=>advance());

// Start
showNextDialog();

// Ball animation loop
(function loop(){requestAnimationFrame(loop);drawBall();})();
</script>
</body>
</html>
