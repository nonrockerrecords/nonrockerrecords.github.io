<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>THE NONROCKER GRIMOIRE</title><link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet"/><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#090006;color:#1b0818;font-family:VT323,monospace;padding:22px;display:grid;place-items:center;background-image:radial-gradient(circle at 50% 30%,rgba(122,0,255,.22),transparent 32%)}body:before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(to bottom,transparent 0 2px,rgba(0,0,0,.18) 3px,transparent 4px);pointer-events:none}.book{width:min(980px,100%);min-height:680px;background:#eee1c8;color:#160616;border:3px solid #090006;box-shadow:0 0 55px rgba(255,0,204,.34),inset 0 0 70px rgba(80,0,80,.12);padding:26px;position:relative}.book:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(-7deg,rgba(0,0,0,.04) 0 1px,transparent 2px 9px)}.nav{position:relative;z-index:1;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.nav a,.nav button{font-family:"Press Start 2P";font-size:9px;color:#111;background:transparent;border:1px solid #111;text-decoration:none;padding:8px}.page{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:28px}.sigil{border:2px solid #111;min-height:420px;display:grid;place-items:center;background:radial-gradient(circle,rgba(255,0,204,.15),transparent 45%)}canvas{width:100%;height:100%}.copy h1{font-size:clamp(38px,7vw,84px);line-height:.85;margin:0 0 18px}.copy p{font-size:29px;line-height:1.05}.folio{font-family:"Press Start 2P";font-size:10px;color:#7a003e}@media(max-width:760px){.page{grid-template-columns:1fr}.sigil{min-height:260px}.book{min-height:auto}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body>
<main class="book"><div class="nav"><span><a href="variations.html">DIRECTORY</a> <a href="index.html">EPK</a></span><span><button id="prev" type="button">PREV</button> <button id="next" type="button">NEXT</button></span></div><section class="page"><div class="sigil"><canvas id="c"></canvas></div><article class="copy"><div class="folio" id="folio"></div><h1 id="title"></h1><p id="text" aria-live="polite"></p></article></section></main>
<script>
const pages=[['RITUAL INTRO','Place one kazoo inside a chalk pentagram. Whisper NONROCKER until the monitor blooms green.'],['TRACK INVOCATION','METALDATA opens the seal. Soju Protocol wets the wires. Track 4 refuses transcription.'],['MEMBER SIGILS','Yung Soju pours. STATUE.EXE observes. NULLSOFT compiles. The drummer appears only reversed.'],['BOOKING SPELL','Send date, venue, outlets, and tolerance for fog. Payment accepted in cash or haunted cables.'],['PRESS CLIPPING','Critics agree: this is either an EPK or a symptom. Both can be projected.']];let i=0,ctx=document.getElementById('c').getContext('2d');
function draw(){const c=ctx.canvas,w=c.width=c.offsetWidth*2,h=c.height=c.offsetHeight*2;ctx.clearRect(0,0,w,h);ctx.translate(w/2,h/2);ctx.strokeStyle='#160616';ctx.lineWidth=4;for(let r=70;r<Math.min(w,h)/2;r+=42){ctx.beginPath();for(let a=0;a<Math.PI*2;a+=.03){let rad=r+Math.sin(a*(i+3))*18;ctx.lineTo(Math.cos(a)*rad,Math.sin(a)*rad)}ctx.closePath();ctx.stroke()}ctx.resetTransform();}
function render(){document.getElementById('folio').textContent=`PAGE ${i+1} / ${pages.length}`;document.getElementById('title').textContent=pages[i][0];document.getElementById('text').textContent=pages[i][1];draw();}
document.getElementById('next').onclick=()=>{i=(i+1)%pages.length;render()};document.getElementById('prev').onclick=()=>{i=(i+pages.length-1)%pages.length;render()};addEventListener('keydown',e=>{if(e.key==='ArrowRight')document.getElementById('next').click();if(e.key==='ArrowLeft')document.getElementById('prev').click();});addEventListener('resize',draw);render();
</script></body></html>
