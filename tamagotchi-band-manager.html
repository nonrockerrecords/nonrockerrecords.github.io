<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>TAMAGOTCHI BAND MANAGER // nonrocker</title><link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet"/><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#070009;color:#f4eaff;font-family:VT323,monospace;display:grid;place-items:center;padding:20px;background-image:radial-gradient(circle at 50% 20%,rgba(255,0,204,.22),transparent 30%),radial-gradient(circle at 80% 80%,rgba(0,229,255,.12),transparent 28%)}body:after{content:"";position:fixed;inset:0;background:repeating-linear-gradient(to bottom,transparent 0 2px,rgba(0,0,0,.2) 3px,transparent 4px);pointer-events:none}.shell{width:min(960px,100%);display:grid;grid-template-columns:360px 1fr;gap:24px}.toy{border-radius:42px;background:#ff2d78;padding:20px;border:4px solid #111;box-shadow:0 0 45px rgba(255,0,204,.45),inset 0 0 30px rgba(255,255,255,.18)}.screen{height:310px;background:#9bbc0f;color:#0f380f;border:6px inset #385000;padding:14px;display:grid;place-items:center;text-align:center}.pet{font-family:"Press Start 2P";font-size:42px;line-height:1.1;animation:bob .8s steps(2,end) infinite}.name{font-size:24px}.buttons{display:flex;justify-content:center;gap:12px;margin-top:18px}.buttons button,.panel button{font:inherit;font-size:22px;border:2px outset #fff;background:#c0c0c0;padding:5px 12px}.panel{border:1px solid #00e5ff;background:rgba(0,0,0,.45);padding:18px}.panel h1{font-size:clamp(38px,6vw,72px);line-height:.85;margin:0 0 16px;text-shadow:3px 0 #ff00cc,-3px 0 #00e5ff}.stat{font-size:26px;margin:8px 0}.meter{height:18px;border:1px solid #00e5ff;background:#000}.meter span{display:block;height:100%;background:linear-gradient(90deg,#39ff14,#ffb800,#ff2d78)}.links a{color:#ff2d78;margin-right:12px;font-family:"Press Start 2P";font-size:9px}@keyframes bob{50%{transform:translateY(8px)}}@media(max-width:760px){.shell{grid-template-columns:1fr}.toy{max-width:360px;margin:auto}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body>
<main class="shell"><section class="toy"><div class="screen"><div><div class="pet" id="pet">NRK<br>o_o</div><div class="name" id="mood">UNSUPERVISED</div></div></div><div class="buttons"><button data-act="soju" type="button">SOJU</button><button data-act="noise" type="button">NOISE</button><button data-act="chaos" type="button">CHAOS</button></div></section><section class="panel"><div class="links"><a href="variations.html">DIRECTORY</a><a href="index.html">EPK</a></div><h1>BAND<br>MANAGER</h1><p style="font-size:25px">Keep the tiny cursed band alive. Low stats evolve it into STATUE.EXE.</p><div id="stats"></div><p id="log" style="font-size:24px;color:#ffb800" aria-live="polite">Awaiting care input.</p></section></main>
<script>
let stats={soju:42,noise:38,chaos:55},log=document.getElementById('log'),pet=document.getElementById('pet'),mood=document.getElementById('mood');
function render(){document.getElementById('stats').innerHTML=Object.entries(stats).map(([k,v])=>`<div class="stat">${k.toUpperCase()} ${v}%<div class="meter"><span style="width:${v}%"></span></div></div>`).join('');const avg=(stats.soju+stats.noise+stats.chaos)/3;if(avg<25){pet.innerHTML='STATUE<br>X_X';mood.textContent='EVOLVED WRONG'}else if(avg>80){pet.innerHTML='NRK<br>^_^';mood.textContent='TOO POWERFUL'}else{pet.innerHTML='NRK<br>o_o';mood.textContent='UNSUPERVISED'}}
document.querySelectorAll('button[data-act]').forEach(b=>b.onclick=()=>{Object.keys(stats).forEach(k=>stats[k]=Math.max(0,stats[k]-7));stats[b.dataset.act]=Math.min(100,stats[b.dataset.act]+28);log.textContent=`${b.dataset.act.toUpperCase()} administered. The manager grows less employable.`;render();});
addEventListener('keydown',e=>{if(e.key==='1')document.querySelector('[data-act=soju]').click();if(e.key==='2')document.querySelector('[data-act=noise]').click();if(e.key==='3')document.querySelector('[data-act=chaos]').click();});render();
</script></body></html>
