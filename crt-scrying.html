<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>CRT SCRYING // nonrocker records</title><link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet"/><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#030305;color:#dff;font-family:VT323,monospace;display:grid;place-items:center;padding:20px}.set{width:min(900px,100%);border:14px solid #1b161d;border-radius:28px;background:#111;padding:18px;box-shadow:0 0 60px rgba(0,229,255,.2)}.screen{position:relative;min-height:480px;border-radius:26px;background:#001013;overflow:hidden;border:6px inset #333;display:grid;place-items:center;text-align:center;padding:26px}.screen:before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle,rgba(255,255,255,.12) 0 1px,transparent 2px 4px);animation:static .18s steps(2,end) infinite;opacity:.35}.screen:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0 3px,rgba(0,0,0,.28) 4px);pointer-events:none}.content{position:relative;z-index:1;text-shadow:0 0 18px #00e5ff}.ch{font-family:"Press Start 2P";font-size:12px;color:#ff2d78}.content h1{font-size:clamp(44px,8vw,96px);margin:14px 0;line-height:.84}.content p{font-size:30px;max-width:620px}.controls{display:flex;justify-content:space-between;gap:12px;margin-top:14px;align-items:center}.controls button,.controls a{font:inherit;font-size:24px;color:#fff;background:#222;border:2px outset #555;padding:6px 14px;text-decoration:none}@keyframes static{50%{transform:translate(5px,-4px);filter:hue-rotate(80deg)}}@media(max-width:600px){.screen{min-height:390px}.controls{flex-wrap:wrap}.content p{font-size:24px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body>
<main class="set"><section class="screen"><div class="content"><div class="ch" id="ch"></div><h1 id="title"></h1><p id="copy" aria-live="polite"></p></div></section><nav class="controls"><button id="down" type="button">CH -</button><span><a href="variations.html">DIRECTORY</a> <a href="index.html">EPK</a></span><button id="up" type="button">CH +</button></nav></main>
<script>
const channels=[['CH03 PRESS','PRESS','A critic appears in the static: haunted arcade cabinet, karaoke lawsuit, five stars from the void.'],['CH07 TRACKS','TRACKLIST','METALDATA. SOJU PROTOCOL. KAZOO FEEDBACK. TRACK 4: NO SIGNAL.'],['CH13 TOUR','TOUR','Basement, planetarium, empty mall, dream sequence. Dates unstable.'],['CH66 DRUMMER','NO SIGNAL','The drummer is almost visible. The chair becomes louder.'],['CH99 CONTACT','BOOKING','booking@nonrocker.fake / press@nonrocker.fake / bring fog.']];let i=0;
function render(){document.getElementById('ch').textContent=channels[i][0];document.getElementById('title').textContent=channels[i][1];document.getElementById('copy').textContent=channels[i][2];}
document.getElementById('up').onclick=()=>{i=(i+1)%channels.length;render()};document.getElementById('down').onclick=()=>{i=(i+channels.length-1)%channels.length;render()};addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowUp')document.getElementById('up').click();if(e.key==='ArrowLeft'||e.key==='ArrowDown')document.getElementById('down').click();});render();
</script></body></html>
