<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>CRT CRYSTAL BALL // nonrocker records</title>
<meta name="description" content="Tune a CRT crystal ball for cursed nonrocker signals."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#030006;color:#f7ecff;font-family:VT323,monospace;overflow-x:hidden}body{background-image:linear-gradient(90deg,rgba(0,0,0,.82),rgba(0,0,0,.16) 46%,rgba(0,0,0,.88)),url("assets/generated/crt-crystal-ball-hero.png");background-size:cover;background-position:center;isolation:isolate}body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 52% 38%,rgba(0,229,255,.24),transparent 23%),repeating-linear-gradient(to bottom,rgba(255,255,255,.04) 0 1px,transparent 2px 5px);mix-blend-mode:screen;animation:signal 4s steps(2,end) infinite}body::after{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(transparent,rgba(0,0,0,.42)),radial-gradient(circle at 50% 45%,transparent 35%,rgba(0,0,0,.62));z-index:5}.stage{min-height:100vh;position:relative;padding:clamp(22px,4vw,52px);display:grid;grid-template-rows:auto 1fr auto}.top{position:relative;z-index:7;display:flex;justify-content:space-between;gap:12px;align-items:center}.brand,.top a{font-family:"Press Start 2P";font-size:9px;letter-spacing:.14em;color:#7ff8ff;text-decoration:none;text-shadow:0 0 14px #00e5ff}.top a{color:#ff74c9}.hero{position:relative;z-index:7;align-self:center;max-width:760px}.kicker{font-family:"Press Start 2P";font-size:10px;color:#ffb800;letter-spacing:.18em;text-shadow:0 0 18px #ff00cc}h1{font-size:clamp(56px,11vw,132px);line-height:.76;margin:18px 0;text-shadow:5px 0 #ff00cc,-5px 0 #00e5ff,0 0 34px rgba(0,229,255,.55)}.readout{max-width:620px;font-size:clamp(25px,3.4vw,38px);line-height:1.02;color:#dff;text-shadow:0 0 18px #00e5ff;border-left:2px solid #00e5ff;padding-left:18px}.controls{position:relative;z-index:7;display:flex;flex-wrap:wrap;align-items:end;gap:18px}.dial{width:130px;aspect-ratio:1;border-radius:50%;border:2px solid rgba(0,229,255,.8);background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.28),transparent 17%),radial-gradient(circle,#00141a,#020407 60%,#111);color:#eaffff;font-family:"Press Start 2P";font-size:9px;letter-spacing:.12em;cursor:pointer;box-shadow:inset 0 0 25px rgba(0,229,255,.35);transform:rotate(var(--r,0deg));transition:transform .25s}.dial:focus-visible,.linkchip:focus-visible{outline:2px solid #ffb800;outline-offset:4px}.linkchip{border:0;border-bottom:1px solid #ff74c9;background:transparent;color:#ffb7e6;font:inherit;font-size:24px;text-decoration:none;cursor:pointer}.meter{font-family:"Press Start 2P";font-size:9px;color:#39ff14;letter-spacing:.14em;text-shadow:0 0 10px #39ff14}.flare{position:absolute;inset:16% 35% 32%;border-radius:45%;background:rgba(0,229,255,.16);filter:blur(18px);mix-blend-mode:screen;pointer-events:none;animation:pulse 1.8s ease-in-out infinite}@keyframes signal{50%{filter:hue-rotate(24deg);transform:translateY(2px)}}@keyframes pulse{50%{opacity:.35;transform:scale(1.05)}}@media(max-width:720px){.stage{padding:18px}.top{align-items:flex-start}.controls{align-items:center}.dial{width:104px}.readout{font-size:27px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.flare{display:none}}
</style>
</head>
<body>
<main class="stage">
  <nav class="top" aria-label="Site links"><div class="brand">NRK CRT-SCRYING DEVICE</div><div><a href="variations.html">DIRECTORY</a> &nbsp; <a href="index.html">EPK</a></div></nav>
  <section class="hero" aria-labelledby="title">
    <div class="kicker" id="channel">CHANNEL 03 // DEAD AIR</div>
    <h1 id="title">CRT<br/>CRYSTAL<br/>BALL</h1>
    <div class="readout" id="readout" aria-live="polite">Touch the tuning dial. The static is pretending not to know your booking fate.</div>
  </section>
  <div class="controls">
    <button class="dial" id="dial" type="button" aria-label="Tune the CRT crystal ball">TUNE</button>
    <button class="linkchip" id="summon" type="button">summon signal</button>
    <div class="meter" id="meter">SIGNAL: 13%</div>
  </div>
  <div class="flare" aria-hidden="true"></div>
</main>
<script>
const channels=[
  ["CHANNEL 03 // DEAD AIR","The drummer appears as a chair-shaped absence. It requests two monitors and no follow-up questions."],
  ["CHANNEL 07 // PRESS","A critic forms in the snow: haunted karaoke machine sues arcade cabinet, loses, joins band."],
  ["CHANNEL 13 // TOUR","Basement, planetarium, mall fountain, your dream last night. All dates are legally blinking."],
  ["CHANNEL 66 // TRACK 4","Do not trust Track 4. Track 4 learned your name from the liner notes."],
  ["CHANNEL 99 // BOOKING","Bring fog, black candles, extension cords, and one apology addressed to the venue."],
  ["CHANNEL 00 // TURBOLAG","The rebrand is visible only when the screen is unplugged."]
];
const dial=document.getElementById("dial"),readout=document.getElementById("readout"),channel=document.getElementById("channel"),meter=document.getElementById("meter");
let i=0,audio;
function beep(){audio=audio||new AudioContext();const o=audio.createOscillator(),g=audio.createGain();o.type="square";o.frequency.value=90+Math.random()*420;g.gain.setValueAtTime(.001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.04,audio.currentTime+.02);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.18);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.2)}
function tune(){i=(i+1)%channels.length;channel.textContent=channels[i][0];readout.textContent=channels[i][1];meter.textContent="SIGNAL: "+(13+i*14)+"%";dial.style.setProperty("--r",(i*47)+"deg");beep()}
dial.addEventListener("click",tune);document.getElementById("summon").addEventListener("click",tune);
addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter"||e.key==="ArrowRight"){e.preventDefault();tune()}});
</script>
</body>
</html>
