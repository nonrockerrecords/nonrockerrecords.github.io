<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FACEMELT V8b // WAVE MORPH+ — nonrocker records</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Major+Mono+Display&display=swap" rel="stylesheet">
  <script type="module" src="https://cdn.jsdelivr.net/npm/@spectrum-web-components/bundle@1.7.0/elements.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --pink:#ff00cc; --cyan:#00f0ff; --lime:#39ff14; --amber:#ffb800; --bg:#040410; }
    body { background:var(--bg); font-family:'VT323',monospace; color:#c8c8d8; overflow-x:hidden; }
    /* Blue-tinted CRT scanlines */
    body::after { content:''; position:fixed; inset:0;
      background:repeating-linear-gradient(180deg,rgba(0,0,255,0.03) 0px,rgba(0,0,255,0.03) 1px,transparent 1px,transparent 4px);
      pointer-events:none; z-index:9100; }
    /* Vignette */
    body::before { content:''; position:fixed; inset:0;
      background:radial-gradient(ellipse at 50% 50%,transparent 46%,rgba(0,0,0,0.70) 100%);
      pointer-events:none; z-index:9099; }

    /* ── Loading ── */
    #loading { position:fixed; inset:0; z-index:9990; background:var(--bg);
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;
      transition:opacity 0.6s; }
    #loading.done { opacity:0; pointer-events:none; }
    .ld-title { font-family:'Major Mono Display',monospace; font-size:11px; letter-spacing:6px; color:var(--cyan); text-shadow:0 0 16px var(--cyan); }
    .ld-sub   { font-size:14px; letter-spacing:3px; color:rgba(0,240,255,0.35); }
    .ld-track { width:260px; height:2px; background:rgba(0,240,255,0.12); }
    #ld-bar   { height:100%; width:0%; background:var(--cyan); box-shadow:0 0 8px var(--cyan); transition:width 0.15s; }
    #ld-step  { font-size:12px; letter-spacing:2px; color:rgba(0,240,255,0.40); }

    /* ── Header ── */
    #hdr { position:fixed; top:0; left:0; right:0; z-index:500; padding:9px 22px;
      display:flex; align-items:center; gap:12px; background:rgba(4,4,16,0.92);
      border-bottom:1px solid rgba(0,240,255,0.18); backdrop-filter:blur(10px); }
    .hdr-logo  { font-family:'Major Mono Display',monospace; font-size:10px; letter-spacing:3px; color:var(--cyan); text-shadow:0 0 10px var(--cyan); }
    .hdr-pipe  { width:1px; height:14px; background:rgba(0,240,255,0.22); }
    .hdr-label { font-size:13px; letter-spacing:2px; color:rgba(255,255,255,0.24); }
    .hdr-badge { margin-left:auto; font-size:10px; letter-spacing:2px; color:var(--pink); text-shadow:0 0 8px var(--pink); }

    #journey { height:1200vh; }
    #sticky  { position:sticky; top:0; height:100vh; display:flex; align-items:center; justify-content:center; overflow:hidden; }
    canvas   { display:block; }

    /* Side wave glyph */
    #wave-glyph { position:fixed; left:18px; top:50%; transform:translateY(-50%);
      width:24px; height:120px; z-index:600; pointer-events:none; }

    /* ── HUD ── */
    #hud { position:fixed; bottom:0; left:0; right:0; z-index:600; padding:6px 22px 12px;
      display:flex; align-items:center; gap:0; background:rgba(4,4,16,0.80);
      border-top:1px solid rgba(0,240,255,0.12); pointer-events:none; }
    #phase-name { font-size:17px; letter-spacing:5px; color:var(--cyan); text-shadow:0 0 12px var(--cyan); flex:1; }
    #phase-sub  { font-size:13px; letter-spacing:2px; color:rgba(255,0,204,0.45); }
    #pct        { font-size:13px; letter-spacing:1px; color:rgba(255,255,255,0.18); margin-left:16px; }
    #wave-info  { font-size:12px; letter-spacing:1px; color:rgba(0,240,255,0.35); margin-left:14px; }

    #prog { position:fixed; top:32px; left:0; height:1px;
      background:linear-gradient(90deg,var(--cyan),var(--pink)); box-shadow:0 0 5px var(--cyan); z-index:700; }
    #hint { position:fixed; right:18px; top:50%; transform:translateY(-50%); writing-mode:vertical-rl;
      font-size:13px; letter-spacing:3px; color:rgba(0,240,255,0.28); animation:blink 2.1s infinite; z-index:600; }
    @keyframes blink { 0%,100%{opacity:.28} 50%{opacity:.75} }
    #foot { padding:50px 24px 38px; text-align:center; border-top:1px solid rgba(0,240,255,0.08);
      display:flex; gap:14px; justify-content:center; flex-wrap:wrap; background:rgba(4,4,16,0.88); }
    sp-theme { display:contents; }
  </style>
</head>
<body>
  <sp-theme color="dark" scale="medium" theme="spectrum-two">
    <div id="loading">
      <div class="ld-title">wave morph // v8b</div>
      <div class="ld-track"><div id="ld-bar"></div></div>
      <div class="ld-sub">SYNTHESIZING FRAMES</div>
      <div id="ld-step">LOADING IMAGES…</div>
    </div>
    <header id="hdr">
      <span class="hdr-logo">nonrocker records</span>
      <div class="hdr-pipe"></div>
      <span class="hdr-label">FACEMELT V8b</span>
      <div class="hdr-pipe"></div>
      <span class="hdr-label">WAVE MORPH+</span>
      <span class="hdr-badge">NRK-2024 // ENHANCED</span>
    </header>
    <div id="journey"><div id="sticky"><canvas id="cvs"></canvas></div></div>
    <canvas id="wave-glyph" width="24" height="120"></canvas>
    <div id="hud">
      <span id="phase-name">PREMELT STATE</span>
      <span id="phase-sub"></span>
      <span id="pct">0%</span>
      <span id="wave-info"></span>
    </div>
    <div id="hint">↓ SCROLL ↓</div>
    <div id="prog" style="width:0%"></div>
    <footer id="foot">
      <sp-button variant="secondary" size="S" onclick="location.href='facemelt-v7b.html'">← V7b POUR+</sp-button>
      <sp-button variant="secondary" size="S" onclick="location.href='slides.html'">SLIDES</sp-button>
      <sp-button variant="secondary" size="S" onclick="location.href='facemelt-v9b.html'">V9b BLINDS+ →</sp-button>
    </footer>
  </sp-theme>
  <script>
  (() => {
    'use strict';

    // ── DOM ──────────────────────────────────────────────────────────────────────
    const cvs    = document.getElementById('cvs');
    const ctx    = cvs.getContext('2d');
    const glyph  = document.getElementById('wave-glyph');
    const gCtx   = glyph.getContext('2d');
    const hud    = { name:document.getElementById('phase-name'), sub:document.getElementById('phase-sub'), pct:document.getElementById('pct'), info:document.getElementById('wave-info') };
    const prog   = document.getElementById('prog');
    const ldBar  = document.getElementById('ld-bar');
    const ldStep = document.getElementById('ld-step');
    const loading= document.getElementById('loading');

    // ── Math helpers ─────────────────────────────────────────────────────────────
    const clamp   = (v,a,b) => Math.max(a, Math.min(b,v));
    const invlerp = (a,b,v) => clamp((v-a)/(b-a), 0, 1);
    const eio     = t => t<.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
    const eo      = t => 1 - Math.pow(1-t, 3);

    // ── Geometry ─────────────────────────────────────────────────────────────────
    let W=0,H=0, imgX=0,imgY=0,imgW=0,imgH=0, SKULL_CX=0,SKULL_CY=0, MAX_R=0;
    const SKULL_X_FRAC = 0.50, SKULL_Y_FRAC = 0.32;

    function resize() {
      W = cvs.width  = window.innerWidth;
      H = cvs.height = window.innerHeight;
      const ar = allImgs[0].naturalWidth / allImgs[0].naturalHeight;
      if (H*ar < W*0.72) { imgH=H*0.92; imgW=imgH*ar; } else { imgW=W*0.70; imgH=imgW/ar; }
      imgX=(W-imgW)/2; imgY=(H-imgH)/2;
      SKULL_CX=imgX+imgW*SKULL_X_FRAC;
      SKULL_CY=imgY+imgH*SKULL_Y_FRAC;
      MAX_R=Math.sqrt(Math.max(SKULL_CX**2+SKULL_CY**2,(W-SKULL_CX)**2+SKULL_CY**2,
        SKULL_CX**2+(H-SKULL_CY)**2,(W-SKULL_CX)**2+(H-SKULL_CY)**2))*1.15;
      initBloom();
    }
    window.addEventListener('resize', () => { if (ready) resize(); });

    // ── Image loading + pixel-blend synthetics ────────────────────────────────────
    let allImgs=[], synthA25,synthA50,synthA75,synthB25,synthB50,synthB75, ready=false;

    function loadImg(src) {
      return new Promise(res => { const i=new Image(); i.onload=()=>res(i); i.onerror=()=>res(null); i.src=src; });
    }

    function pixelBlend(i1,i2,alpha) {
      const MAX=640, ar=i1.naturalHeight/i1.naturalWidth;
      const w=Math.min(i1.naturalWidth,MAX), h=Math.round(w*ar);
      const oc=document.createElement('canvas'); oc.width=w; oc.height=h;
      const ox=oc.getContext('2d');
      ox.drawImage(i1,0,0,w,h); const d1=ox.getImageData(0,0,w,h).data;
      ox.clearRect(0,0,w,h);
      ox.drawImage(i2,0,0,w,h); const d2=ox.getImageData(0,0,w,h).data;
      const out=ox.createImageData(w,h); const od=out.data;
      const b=alpha, a=1-alpha;
      for (let i=0;i<od.length;i++) od[i]=d1[i]*a+d2[i]*b;
      ox.putImageData(out,0,0); return oc;
    }

    async function setLoad(pct, label) {
      ldBar.style.width=pct+'%'; ldStep.textContent=label;
      await new Promise(r=>setTimeout(r,10));
    }

    async function init() {
      allImgs = await Promise.all(['facemelt-premelt.png','Facemelt.png','Facemelt-endmelt.png'].map(loadImg));
      if (!allImgs.every(Boolean)) { ldStep.textContent='ERROR: IMAGES NOT FOUND'; return; }
      await setLoad(10,'BLENDING A 25%…');  synthA25 = pixelBlend(allImgs[0],allImgs[1],0.25);
      await setLoad(25,'BLENDING A 50%…');  synthA50 = pixelBlend(allImgs[0],allImgs[1],0.50);
      await setLoad(40,'BLENDING A 75%…');  synthA75 = pixelBlend(allImgs[0],allImgs[1],0.75);
      await setLoad(55,'BLENDING B 25%…');  synthB25 = pixelBlend(allImgs[1],allImgs[2],0.25);
      await setLoad(70,'BLENDING B 50%…');  synthB50 = pixelBlend(allImgs[1],allImgs[2],0.50);
      await setLoad(85,'BLENDING B 75%…');  synthB75 = pixelBlend(allImgs[1],allImgs[2],0.75);
      await setLoad(100,'READY');
      await new Promise(r=>setTimeout(r,250));
      loading.classList.add('done');
      setTimeout(()=>{ loading.style.display='none'; },700);
      ready=true; resize(); requestAnimationFrame(draw);
    }
    init();

    // ── Particle system ───────────────────────────────────────────────────────────
    class ParticleSystem {
      constructor(max=600) { this.pool=[]; this.max=max; }
      emit(x,y,{vx,vy,life,size,color,gravity=0.06}) {
        if (this.pool.length>=this.max) return;
        this.pool.push({x,y,vx,vy,life,maxLife:life,size,color,gravity,alpha:1});
      }
      update(dt) {
        for (let i=this.pool.length-1;i>=0;i--) {
          const p=this.pool[i];
          p.x+=p.vx*dt*60; p.vy+=p.gravity; p.y+=p.vy*dt*60;
          p.life--; p.alpha=p.life/p.maxLife;
          if(p.life<=0) this.pool.splice(i,1);
        }
      }
      draw(ctx) {
        ctx.save();
        this.pool.forEach(p=>{
          ctx.globalAlpha=p.alpha*0.88;
          ctx.fillStyle=p.color;
          ctx.shadowColor=p.color; ctx.shadowBlur=p.size*4;
          ctx.beginPath(); ctx.arc(p.x,p.y,p.size*Math.max(0.1,p.alpha),0,Math.PI*2); ctx.fill();
        });
        ctx.restore();
      }
    }
    const ps = new ParticleSystem(700);

    // ── Bloom ─────────────────────────────────────────────────────────────────────
    let bloomC, bloomCtx;
    function initBloom() {
      bloomC=document.createElement('canvas');
      bloomC.width=W>>1; bloomC.height=H>>1;
      bloomCtx=bloomC.getContext('2d');
    }
    function applyBloom(alpha=0.20) {
      const bW=bloomC.width, bH=bloomC.height;
      bloomCtx.clearRect(0,0,bW,bH);
      bloomCtx.filter='blur(9px) brightness(2.2)';
      bloomCtx.drawImage(cvs,0,0,bW,bH);
      bloomCtx.filter='none';
      ctx.save();
      ctx.globalCompositeOperation='screen';
      ctx.globalAlpha=alpha;
      ctx.drawImage(bloomC,0,0,W,H);
      ctx.restore();
    }

    // ── Heat haze displacement ────────────────────────────────────────────────────
    let hazeFrame=0;
    function applyHeatHaze(centerY, stripH, amp) {
      if (amp<0.6) return;
      hazeFrame++;
      if (hazeFrame%2!==0) return;
      const y0=Math.max(0,Math.floor(centerY-stripH/2));
      const y1=Math.min(H,Math.ceil(centerY+stripH/2));
      const h=y1-y0; if(h<=0) return;
      const src=ctx.getImageData(0,y0,W,h);
      const dst=ctx.createImageData(W,h);
      const sd=src.data, dd=dst.data;
      const t=performance.now()/1000;
      for (let row=0;row<h;row++) {
        const wY=y0+row, env=Math.sin((row/h)*Math.PI);
        for (let col=0;col<W;col++) {
          const dx=Math.round(amp*env*Math.sin(wY*0.18+col*0.04+t*2.1));
          const dy=Math.round(amp*0.3*env*Math.sin(col*0.12+t*1.6));
          const sc=clamp(col+dx,0,W-1), sr=clamp(row+dy,0,h-1);
          const si=(sr*W+sc)*4, di=(row*W+col)*4;
          dd[di]=sd[si]; dd[di+1]=sd[si+1]; dd[di+2]=sd[si+2]; dd[di+3]=sd[si+3];
        }
      }
      ctx.putImageData(dst,0,y0);
    }

    // ── Scroll ───────────────────────────────────────────────────────────────────
    let scrollT=0;
    window.addEventListener('scroll',()=>{
      const el=document.getElementById('journey');
      scrollT=clamp(window.scrollY/(el.offsetHeight-window.innerHeight),0,1);
      prog.style.width=(scrollT*100)+'%';
    },{passive:true});

    // ── Draw helpers ──────────────────────────────────────────────────────────────
    function drawFull(img,alpha=1) {
      if(!img||alpha<=0) return;
      ctx.save(); ctx.globalAlpha=clamp(alpha,0,1);
      ctx.drawImage(img,imgX,imgY,imgW,imgH);
      ctx.restore();
    }

    // ── Wave functions ────────────────────────────────────────────────────────────
    function waveTopDown(x, progress, animT) {
      const A=32*Math.sin(progress*Math.PI);
      const nw=(x-imgX)/imgW;
      return imgY+progress*imgH
        +A*Math.sin(nw*2.8*Math.PI+animT*1.4)
        +A*0.4*Math.sin(nw*5.3*Math.PI-animT*0.9)
        +A*0.2*Math.sin(nw*9.1*Math.PI+animT*2.1);
    }
    function wavePincerTop(x, progress, animT) {
      const A=28*Math.sin(progress*Math.PI);
      const nw=(x-imgX)/imgW;
      return imgY+progress*imgH*0.5
        +A*Math.sin(nw*3.2*Math.PI+animT*1.2)
        +A*0.45*Math.sin(nw*6.1*Math.PI-animT*0.7);
    }
    function wavePincerBot(x, progress, animT) {
      const A=28*Math.sin(progress*Math.PI);
      const nw=(x-imgX)/imgW;
      return imgY+imgH-progress*imgH*0.5
        -A*Math.sin(nw*3.2*Math.PI+animT*1.2+Math.PI)
        -A*0.45*Math.sin(nw*6.1*Math.PI-animT*0.7+Math.PI);
    }
    function waveBottomUp(x, progress, animT) {
      const A=32*Math.sin(progress*Math.PI);
      const nw=(x-imgX)/imgW;
      return imgY+imgH-progress*imgH
        -A*Math.sin(nw*2.8*Math.PI-animT*1.4)
        -A*0.4*Math.sin(nw*5.3*Math.PI+animT*0.9);
    }
    function waveRadialRadius(progress) { return eo(progress)*MAX_R; }

    // ── Build clip paths ──────────────────────────────────────────────────────────
    const STEP=3;
    function clipTopDown(progress, animT) {
      ctx.beginPath();
      ctx.moveTo(0,imgY); ctx.lineTo(W,imgY);
      ctx.lineTo(W,waveTopDown(W,progress,animT));
      for (let x=W;x>=0;x-=STEP) ctx.lineTo(x,waveTopDown(x,progress,animT));
      ctx.closePath();
    }
    function clipPincer(progress, animT) {
      ctx.beginPath();
      ctx.moveTo(0,imgY); ctx.lineTo(W,imgY);
      ctx.lineTo(W,wavePincerTop(W,progress,animT));
      for (let x=W;x>=0;x-=STEP) ctx.lineTo(x,wavePincerTop(x,progress,animT));
      ctx.closePath();
      ctx.moveTo(0,imgY+imgH); ctx.lineTo(W,imgY+imgH);
      ctx.lineTo(W,wavePincerBot(W,progress,animT));
      for (let x=W;x>=0;x-=STEP) ctx.lineTo(x,wavePincerBot(x,progress,animT));
      ctx.closePath();
    }
    function clipRadial(progress) {
      ctx.beginPath();
      ctx.arc(SKULL_CX,SKULL_CY,waveRadialRadius(progress),0,Math.PI*2);
    }
    function clipBottomUp(progress, animT) {
      ctx.beginPath();
      ctx.moveTo(0,imgY+imgH); ctx.lineTo(W,imgY+imgH);
      ctx.lineTo(W,waveBottomUp(W,progress,animT));
      for (let x=W;x>=0;x-=STEP) ctx.lineTo(x,waveBottomUp(x,progress,animT));
      ctx.closePath();
    }

    // ── Wave glow strokes ─────────────────────────────────────────────────────────
    function strokeWave(waveFn, animT, progress, color) {
      ctx.save(); ctx.beginPath();
      ctx.moveTo(0,waveFn(0,progress,animT));
      for (let x=0;x<=W;x+=STEP) ctx.lineTo(x,waveFn(x,progress,animT));
      ctx.strokeStyle=color; ctx.lineWidth=2.2; ctx.shadowColor=color; ctx.shadowBlur=18; ctx.stroke();
      ctx.lineWidth=5; ctx.globalAlpha=0.18; ctx.stroke();
      ctx.restore();
    }
    function strokeCircle(r, color) {
      ctx.save(); ctx.beginPath(); ctx.arc(SKULL_CX,SKULL_CY,r,0,Math.PI*2);
      ctx.strokeStyle=color; ctx.lineWidth=2.5; ctx.shadowColor=color; ctx.shadowBlur=22; ctx.stroke();
      ctx.globalAlpha=0.18; ctx.lineWidth=8; ctx.stroke();
      ctx.restore();
    }

    // ── Particle emission along wave boundary ─────────────────────────────────────
    // Samples N points along the wave and sprays particles perpendicular to the front
    const N_SAMPLES=24;
    let emitFrame=0;

    function emitWaveParticles(waveFn, progress, animT, upward=true) {
      if (emitFrame%2!==0) return; // throttle
      const dir = upward ? -1 : 1;
      for (let s=0; s<N_SAMPLES; s++) {
        const x = imgX + (s/(N_SAMPLES-1))*imgW;
        const y = waveFn(x, progress, animT);
        if (y<imgY-20 || y>imgY+imgH+20) continue;
        // Approximate normal: finite difference
        const dx2=6;
        const y1=waveFn(x-dx2,progress,animT), y2=waveFn(x+dx2,progress,animT);
        const slope=(y2-y1)/(2*dx2);
        const nLen=Math.sqrt(1+slope*slope);
        const nx=-slope/nLen, ny=1/nLen; // outward normal (pointing "up" relative to wave)
        const speed=1.8+Math.random()*2.4;
        ps.emit(x+Math.random()*8-4, y, {
          vx: nx*speed*dir + (Math.random()-0.5)*1.2,
          vy: ny*speed*dir + (Math.random()-0.5)*1.2,
          life: (18+Math.random()*14)|0,
          size: 1.0+Math.random()*1.4,
          color: Math.random()<0.7?'#00f0ff':'#ff00cc',
          gravity: 0.05
        });
      }
    }

    function emitRadialParticles(radius, progress) {
      if (emitFrame%2!==0) return;
      const nPts=18;
      for (let i=0;i<nPts;i++) {
        const a = (i/nPts)*Math.PI*2;
        const x = SKULL_CX + Math.cos(a)*radius;
        const y = SKULL_CY + Math.sin(a)*radius;
        const speed=1.5+Math.random()*2;
        ps.emit(x, y, {
          vx: Math.cos(a)*speed + (Math.random()-0.5)*0.8,
          vy: Math.sin(a)*speed + (Math.random()-0.5)*0.8,
          life: (16+Math.random()*12)|0,
          size: 0.9+Math.random()*1.2,
          color: Math.random()<0.7?'#00f0ff':'#ff00cc',
          gravity: 0.04
        });
      }
    }

    // ── Wave morph draw functions ─────────────────────────────────────────────────
    function drawWaveTopDown(imgA, imgB, progress, animT) {
      drawFull(imgA);
      ctx.save(); clipTopDown(progress,animT); ctx.clip(); drawFull(imgB); ctx.restore();
      strokeWave(waveTopDown,animT,progress,'#00f0ff');
      emitFrame++;
      emitWaveParticles(waveTopDown,progress,animT,false);
      applyHeatHaze(waveTopDown(W/2,progress,animT), 55, 9*Math.sin(progress*Math.PI));
      return 'top-down';
    }

    function drawWavePincer(imgA, imgB, progress, animT) {
      drawFull(imgA);
      ctx.save(); clipPincer(progress,animT); ctx.clip(); drawFull(imgB); ctx.restore();
      strokeWave(wavePincerTop,animT,progress,'#ff00cc');
      strokeWave(wavePincerBot,animT,progress,'#ff00cc');
      emitFrame++;
      emitWaveParticles(wavePincerTop,progress,animT,false);
      emitWaveParticles(wavePincerBot,progress,animT,true);
      const midY=(wavePincerTop(W/2,progress,animT)+wavePincerBot(W/2,progress,animT))/2;
      applyHeatHaze(midY, 55, 9*Math.sin(progress*Math.PI));
      return 'pincer';
    }

    function drawWaveRadial(imgA, imgB, progress, animT) {
      drawFull(imgA);
      ctx.save(); clipRadial(progress); ctx.clip(); drawFull(imgB); ctx.restore();
      const r=waveRadialRadius(progress);
      strokeCircle(r,'#00f0ff');
      emitFrame++;
      emitRadialParticles(r, progress);
      applyHeatHaze(SKULL_CY, 55, 9*Math.sin(progress*Math.PI));
      return 'radial';
    }

    function drawWaveBottomUp(imgA, imgB, progress, animT) {
      drawFull(imgA);
      ctx.save(); clipBottomUp(progress,animT); ctx.clip(); drawFull(imgB); ctx.restore();
      strokeWave(waveBottomUp,animT,progress,'#ff00cc');
      emitFrame++;
      emitWaveParticles(waveBottomUp,progress,animT,true);
      applyHeatHaze(waveBottomUp(W/2,progress,animT), 55, 9*Math.sin(progress*Math.PI));
      return 'bottom-up';
    }

    // ── Phase dispatch (8 sub-transitions + 3 holds) ─────────────────────────────
    function getPhase(t) {
      if (t<0.07) return { name:'PREMELT STATE',        sub:'',               img:allImgs[0] };
      if (t<0.20) return { name:'WAVE: TOP→DOWN',       sub:'PREMELT → 25%',  draw:(p,at)=>drawWaveTopDown(allImgs[0],synthA25, eio(p),at), p:invlerp(0.07,0.20,t) };
      if (t<0.33) return { name:'WAVE: PINCER',         sub:'25% → 50%',      draw:(p,at)=>drawWavePincer( synthA25,  synthA50, eio(p),at), p:invlerp(0.20,0.33,t) };
      if (t<0.44) return { name:'WAVE: RADIAL',         sub:'50% → 75%',      draw:(p,at)=>drawWaveRadial( synthA50,  synthA75, eio(p),at), p:invlerp(0.33,0.44,t) };
      if (t<0.54) return { name:'WAVE: BOTTOM→UP',      sub:'75% → FACEMELT', draw:(p,at)=>drawWaveBottomUp(synthA75, allImgs[1],eio(p),at), p:invlerp(0.44,0.54,t) };
      if (t<0.62) return { name:'MID MELT',             sub:'',               img:allImgs[1] };
      if (t<0.71) return { name:'WAVE: TOP→DOWN',       sub:'FACEMELT → 25%', draw:(p,at)=>drawWaveTopDown(allImgs[1],synthB25, eio(p),at), p:invlerp(0.62,0.71,t) };
      if (t<0.80) return { name:'WAVE: PINCER',         sub:'25% → 50%',      draw:(p,at)=>drawWavePincer( synthB25,  synthB50, eio(p),at), p:invlerp(0.71,0.80,t) };
      if (t<0.88) return { name:'WAVE: RADIAL',         sub:'50% → 75%',      draw:(p,at)=>drawWaveRadial( synthB50,  synthB75, eio(p),at), p:invlerp(0.80,0.88,t) };
      if (t<0.95) return { name:'WAVE: BOTTOM→UP',      sub:'75% → END MELT', draw:(p,at)=>drawWaveBottomUp(synthB75, allImgs[2],eio(p),at), p:invlerp(0.88,0.95,t) };
      return              { name:'END STATE',            sub:'MELT COMPLETE',  img:allImgs[2] };
    }

    // ── Side glyph ────────────────────────────────────────────────────────────────
    function drawGlyph(animT, t) {
      gCtx.clearRect(0,0,24,120);
      gCtx.strokeStyle='rgba(0,240,255,0.5)'; gCtx.lineWidth=1.5;
      gCtx.shadowColor='#00f0ff'; gCtx.shadowBlur=6;
      gCtx.beginPath();
      for (let y=0;y<=120;y+=2) {
        const x=12+8*Math.sin(y*0.18+animT*2.0+t*4);
        if(y===0) gCtx.moveTo(x,y); else gCtx.lineTo(x,y);
      }
      gCtx.stroke();
    }

    // ── Main loop ─────────────────────────────────────────────────────────────────
    let animT=0, lastTS=0;

    function draw(ts=0) {
      requestAnimationFrame(draw);
      if(!ready) return;
      const dt=Math.min((ts-lastTS)/1000,0.05);
      lastTS=ts; animT+=dt;

      const t=scrollT;
      const ph=getPhase(t);

      ctx.clearRect(0,0,W,H);
      ctx.fillStyle='#040410'; ctx.fillRect(0,0,W,H);

      let waveMode='';
      if (ph.img) {
        drawFull(ph.img);
        if (ph.img!==allImgs[0]) {
          const pulse=0.15+Math.sin(animT*2.5)*0.07;
          ctx.save(); ctx.globalCompositeOperation='screen';
          const grd=ctx.createRadialGradient(SKULL_CX,SKULL_CY,0,SKULL_CX,SKULL_CY,imgW*0.38);
          grd.addColorStop(0,`rgba(0,240,255,${pulse*0.5})`);
          grd.addColorStop(0.4,`rgba(255,0,204,${pulse*0.3})`);
          grd.addColorStop(1,'rgba(0,0,0,0)');
          ctx.fillStyle=grd; ctx.fillRect(0,0,W,H); ctx.restore();
        }
      } else {
        waveMode = ph.draw(ph.p,animT)||'';
      }

      // Particles
      ps.update(dt); ps.draw(ctx);

      // Bloom
      applyBloom(ph.img && ph.img!==allImgs[0] ? 0.28 : 0.16);

      // CRT ghost roll
      const ry=animT*22%H;
      ctx.save(); ctx.globalAlpha=0.025; ctx.fillStyle='#00f0ff';
      [ry,(ry+H*0.5)%H].forEach(y=>ctx.fillRect(0,y,W,1));
      ctx.restore();

      drawGlyph(animT, t);

      hud.name.textContent=ph.name;
      hud.sub.textContent=ph.sub||'';
      hud.pct.textContent=Math.round(t*100)+'%';
      hud.info.textContent=waveMode?`MODE: ${waveMode.toUpperCase()}`:'';
    }
  })();
  </script>
</body>
</html>
