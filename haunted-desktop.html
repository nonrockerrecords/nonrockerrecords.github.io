<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>HAUNTED DESKTOP // nonrocker records</title><link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet"/><style>
*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;background:#050008;color:#fff;font-family:VT323,monospace;background-image:radial-gradient(circle at 70% 20%,rgba(255,0,204,.2),transparent 28%),linear-gradient(135deg,#050008,#001016)}body:after{content:"";position:fixed;inset:0;background:repeating-linear-gradient(to bottom,transparent 0 2px,rgba(0,0,0,.18) 3px,transparent 4px);pointer-events:none}.desktop{height:calc(100vh - 36px);padding:18px;display:grid;grid-template-columns:repeat(2,105px);grid-auto-rows:112px;gap:12px;align-content:start}.icon{background:transparent;border:0;color:#fff;font:inherit;font-size:18px;text-shadow:0 2px #000;cursor:pointer}.ico{height:58px;width:70px;margin:auto;border:2px solid #00e5ff;background:#000;display:grid;place-items:center;color:#ff2d78;font-family:"Press Start 2P";font-size:12px;box-shadow:0 0 20px rgba(0,229,255,.35)}.win{position:absolute;top:90px;left:210px;width:min(460px,86vw);background:#c0c0c0;color:#000;border:2px solid #fff;box-shadow:5px 5px 0 #000;display:none}.title{background:#000080;color:#fff;padding:5px 8px;display:flex;justify-content:space-between;cursor:move}.content{padding:14px;font-size:22px;line-height:1.1}.close{background:#c0c0c0;border:1px outset #fff;font:inherit}.taskbar{height:36px;background:#c0c0c0;border-top:2px solid #fff;display:flex;align-items:center;gap:10px;padding:4px;color:#000}.start{border:2px outset #fff;padding:2px 12px}.links{margin-left:auto}.links a{color:#000;margin:0 8px}@media(max-width:620px){.desktop{grid-template-columns:repeat(3,1fr);grid-auto-rows:96px}.win{left:7vw!important;top:150px!important}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body>
<main class="desktop" id="desk"></main>
<div class="taskbar"><div class="start">START</div><span>nonrocker haunted desktop</span><div class="links"><a href="variations.html">directory</a><a href="index.html">epk</a></div></div>
<script>
const files={tracks:['TRACKLIST.TXT','METALDATA<br>SOJU PROTOCOL<br>KAZOO FEEDBACK<br>DIDGERIDOO RUNTIME<br>TRACK 4: REDACTED'],booking:['BOOKING.EXE','Requirements: two outlets, one dark room, no questions about the chair.<br><br>booking@nonrocker.fake'],press:['PRESS_QUOTES.SCR','"A mall-goth modem possession."<br>"This EPK bit me."<br>"No BPM. No God. No refund."'],drummer:['DRUMMER_LOG.BMP','Frame 001: empty chair.<br>Frame 002: empty chair, warmer.<br>Frame 003: denial received.']};const desk=document.getElementById('desk');let z=10;
Object.entries(files).forEach(([k,v],i)=>{desk.insertAdjacentHTML('beforeend',`<button class="icon" data-k="${k}" type="button"><div class="ico">${v[0].slice(0,3)}</div>${v[0]}</button><section class="win" id="w-${k}" style="top:${80+i*34}px;left:${210+i*38}px"><div class="title">${v[0]}<button class="close" type="button">x</button></div><div class="content">${v[1]}</div></section>`);});
document.querySelectorAll('.icon').forEach(b=>b.onclick=()=>{const w=document.getElementById('w-'+b.dataset.k);w.style.display='block';w.style.zIndex=++z;});
document.querySelectorAll('.close').forEach(b=>b.onclick=e=>e.target.closest('.win').style.display='none');
document.querySelectorAll('.title').forEach(t=>{let w=t.parentElement,drag=false,ox=0,oy=0;t.onpointerdown=e=>{drag=true;w.style.zIndex=++z;ox=e.clientX-w.offsetLeft;oy=e.clientY-w.offsetTop;t.setPointerCapture(e.pointerId)};t.onpointermove=e=>{if(drag){w.style.left=e.clientX-ox+'px';w.style.top=e.clientY-oy+'px'}};t.onpointerup=()=>drag=false;});
</script></body></html>
