<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SOJU PROTOCOL — NRK-ADV-001</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  :root{
    --ega-black:#000000;
    --ega-blue:#0000aa;
    --ega-green:#00aa00;
    --ega-cyan:#00aaaa;
    --ega-red:#aa0000;
    --ega-magenta:#aa00aa;
    --ega-brown:#aa5500;
    --ega-white:#aaaaaa;
    --ega-dgrey:#555555;
    --ega-bblue:#5555ff;
    --ega-bgreen:#55ff55;
    --ega-bcyan:#55ffff;
    --ega-bred:#ff5555;
    --ega-bmagenta:#ff55ff;
    --ega-yellow:#ffff55;
    --ega-bwhite:#ffffff;
  }

  html,body{
    width:100%;height:100%;
    background:#000;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    font-family:'Courier New',monospace;
    cursor:default;
  }

  /* CRT phosphor glow */
  body::after{
    content:'';position:fixed;inset:0;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,0.18) 0px,rgba(0,0,0,0.18) 1px,transparent 1px,transparent 3px);
    pointer-events:none;z-index:9000;
  }

  /* Virtual 320x200 screen scaled up */
  #screen{
    position:relative;
    width:min(100vw, calc(100vh * 1.6));
    aspect-ratio:16/10;
    background:#000;
    image-rendering:pixelated;
    border:3px solid #333;
    overflow:hidden;
  }

  /* ── PHASE: LOGO ── */
  #ph-logo{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#000;
    z-index:10;
  }
  .logo-text{
    font-family:'VT323',monospace;
    color:var(--ega-bwhite);
    font-size:clamp(18px,3.5vw,36px);
    letter-spacing:.12em;
    text-align:center;
    opacity:0;
    animation:fadeIn .6s .4s forwards;
  }
  .logo-sub{
    font-family:'VT323',monospace;
    color:var(--ega-white);
    font-size:clamp(12px,2vw,20px);
    letter-spacing:.25em;
    margin-top:.4em;
    opacity:0;
    animation:fadeIn .6s 1.2s forwards;
  }
  @keyframes fadeIn{to{opacity:1}}

  /* ── PHASE: TITLE ── */
  #ph-title{
    position:absolute;inset:0;
    display:none;flex-direction:column;align-items:center;justify-content:center;
    background:#000;z-index:10;
  }
  .title-main{
    font-family:'VT323',monospace;
    color:var(--ega-yellow);
    font-size:clamp(36px,7vw,72px);
    letter-spacing:.08em;
    text-shadow:2px 2px var(--ega-brown);
    text-align:center;
    animation:titlePop .3s ease-out;
  }
  @keyframes titlePop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
  .title-sub{
    font-family:'VT323',monospace;
    color:var(--ega-bgreen);
    font-size:clamp(13px,2.2vw,22px);
    letter-spacing:.06em;
    margin-top:.5em;
    text-align:center;
  }
  .title-cat{
    font-family:'VT323',monospace;
    color:var(--ega-cyan);
    font-size:clamp(10px,1.6vw,16px);
    letter-spacing:.18em;
    margin-top:.8em;
    border:1px solid var(--ega-cyan);
    padding:.15em .8em;
  }
  .title-press{
    font-family:'VT323',monospace;
    color:var(--ega-white);
    font-size:clamp(11px,1.8vw,18px);
    letter-spacing:.15em;
    margin-top:1.6em;
    animation:blink .8s step-end infinite;
  }
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

  /* ── PHASE: GAME ── */
  #ph-game{
    position:absolute;inset:0;
    display:none;flex-direction:column;
    background:#000;z-index:10;
  }

  /* HUD bar */
  #hud{
    background:var(--ega-blue);
    display:flex;align-items:center;justify-content:space-between;
    padding:.3em 1em;
    flex-shrink:0;
    border-bottom:2px solid var(--ega-bblue);
  }
  .hud-item{
    font-family:'VT323',monospace;
    font-size:clamp(12px,2vw,20px);
    color:var(--ega-bwhite);
    letter-spacing:.1em;
  }
  .hud-score{color:var(--ega-yellow);}

  /* Scene */
  #scene{
    flex:1;position:relative;overflow:hidden;
  }
  #scene-img{
    width:100%;height:100%;
    object-fit:cover;object-position:center top;
    image-rendering:pixelated;
    /* EGA filter: desaturate, crush to 16 colors via filter chain */
    filter:contrast(1.5) saturate(0) sepia(1) hue-rotate(90deg) brightness(0.85) contrast(1.8) saturate(1.6);
  }
  /* Dithering overlay */
  #scene::after{
    content:'';
    position:absolute;inset:0;
    background-image:
      url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAGklEQVQI12NgYGD4z8BQDwAAAP//AwBY8AX/RkYB6QAAAABJRU5ErkJggg==");
    background-size:2px 2px;
    opacity:.25;
    pointer-events:none;
    mix-blend-mode:overlay;
  }

  /* Dialog box at bottom of scene */
  #dialog{
    position:absolute;bottom:0;left:0;right:0;
    background:var(--ega-bwhite);
    border-top:3px solid var(--ega-black);
    padding:.5em .8em .5em;
    min-height:22%;
    display:none;
  }
  .dlg-name{
    font-family:'VT323',monospace;
    font-size:clamp(11px,1.8vw,18px);
    color:var(--ega-blue);
    font-weight:bold;
    letter-spacing:.06em;
    margin-bottom:.2em;
  }
  .dlg-text{
    font-family:'VT323',monospace;
    font-size:clamp(11px,1.7vw,17px);
    color:var(--ega-black);
    line-height:1.4;
    letter-spacing:.03em;
  }
  .dlg-continue{
    font-family:'VT323',monospace;
    font-size:clamp(9px,1.4vw,14px);
    color:var(--ega-blue);
    text-align:right;
    margin-top:.3em;
    animation:blink .8s step-end infinite;
  }

  /* Parser */
  #parser{
    background:#000;
    border-top:2px solid var(--ega-white);
    padding:.4em .8em;
    flex-shrink:0;
    display:none;
  }
  .parser-prompt{
    font-family:'VT323',monospace;
    font-size:clamp(12px,1.9vw,19px);
    color:var(--ega-bwhite);
    letter-spacing:.06em;
    margin-bottom:.2em;
  }
  .parser-input-row{
    display:flex;align-items:center;gap:.4em;
  }
  .parser-label{
    font-family:'VT323',monospace;
    font-size:clamp(12px,1.9vw,19px);
    color:var(--ega-yellow);
  }
  #parser-text{
    font-family:'VT323',monospace;
    font-size:clamp(12px,1.9vw,19px);
    color:var(--ega-bwhite);
    letter-spacing:.06em;
    min-width:8ch;
  }
  #parser-cursor{
    font-family:'VT323',monospace;
    font-size:clamp(12px,1.9vw,19px);
    color:var(--ega-bwhite);
    animation:blink .6s step-end infinite;
  }
  .parser-response{
    font-family:'VT323',monospace;
    font-size:clamp(10px,1.6vw,16px);
    color:var(--ega-bgreen);
    margin-top:.2em;
    letter-spacing:.03em;
    min-height:1.4em;
  }
</style>
</head>
<body>
<div id="screen">

  <!-- PHASE 1: LOGO -->
  <div id="ph-logo">
    <div class="logo-text">nonrocker records</div>
    <div class="logo-sub">presents...</div>
  </div>

  <!-- PHASE 2: TITLE -->
  <div id="ph-title">
    <div class="title-main">SOJU PROTOCOL</div>
    <div class="title-sub">A Quest for the Biggest Kazoo in All of London</div>
    <div class="title-cat">NRK-ADV-001</div>
    <div class="title-press">-- PRESS ANY KEY --</div>
  </div>

  <!-- PHASE 3: GAME -->
  <div id="ph-game">
    <div id="hud">
      <span class="hud-item">YUNG SOJU</span>
      <span class="hud-item hud-score">SCORE: <span id="score">00000</span></span>
      <span class="hud-item">LONDON PARK</span>
    </div>
    <div id="scene">
      <img id="scene-img" src="sierra-scene.png" alt="London Park"/>
      <div id="dialog">
        <div class="dlg-name" id="dlg-name"></div>
        <div class="dlg-text" id="dlg-text"></div>
        <div class="dlg-continue">&#9654; press any key</div>
      </div>
    </div>
    <div id="parser">
      <div class="parser-prompt">WHAT WOULD YOU LIKE TO DO?</div>
      <div class="parser-input-row">
        <span class="parser-label">&gt;</span>
        <span id="parser-text"></span>
        <span id="parser-cursor">&#9608;</span>
      </div>
      <div class="parser-response" id="parser-resp"></div>
    </div>
  </div>

</div>

<script>
// AUDIO
let audioCtx = null;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();}
function beep(freq,dur,type='square',vol=0.18,delay=0){
  initAudio();
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(vol,audioCtx.currentTime+delay);
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+delay+dur);
  o.connect(g);g.connect(audioCtx.destination);
  o.start(audioCtx.currentTime+delay);o.stop(audioCtx.currentTime+delay+dur+0.01);
}
function fanfare(){
  // SCI0-style 4-note ascending fanfare
  const notes=[261,329,392,523];
  notes.forEach((f,i)=>beep(f,.18,'square',0.15,i*.19));
}

// PHASES
let phase=0;
const DIALOGS=[
  {name:'KAZOO_HAWK',text:'"Here, go wear this and fetch me the biggest goose in all of London."'},
  {name:'NULLSOFT',text:'"...this hat has a blue gem. KAZOO_HAWK, who wore this before us?"'},
  {name:'KAZOO_HAWK',text:'"Yes."'},
  {name:'YUNG SOJU',text:'[YUNG SOJU says nothing. The beanie stays on.]'},
];
let dlgIdx=0;

const PARSER_CMDS={
  'LOOK AT HAT':   'NULLSOFT holds the hat carefully. Gold trim, three peacock feathers, one blue gem. Smells faintly of soju.',
  'TAKE HAT':      'NULLSOFT passes the hat to YUNG SOJU. +10 POINTS. The goose quest has begun.',
  'ASK ABOUT GOOSE':'KAZOO_HAWK just stares. NULLSOFT whispers: "I think the goose is a metaphor." KAZOO_HAWK stares harder.',
  'LOOK AT KAZOO_HAWK':'A Shiba Inu in full red-and-gold samurai armor. Gold kazoo at the belt. Engraved: NRK-666.',
  'LOOK AT NULLSOFT':'Pink hair, purple hoodie, glasses. NULLSOFT holds the feathered hat like it might bite. Keys player, NRK-2024.',
  'SMELL HAT':     'It smells like a park and ambition.',
  'INVENTORY':     'You have: 1 feathered hat, 0 geese, 1 bottle of soju (empty).',
};
const CMD_SEQUENCE=['LOOK AT HAT','TAKE HAT','ASK ABOUT GOOSE'];
let cmdIdx=0,typing=false,parserLocked=false;

function showPhase(id){
  ['ph-logo','ph-title','ph-game'].forEach(p=>document.getElementById(p).style.display='none');
  document.getElementById(id).style.display='flex';
}

function advance(){
  initAudio();
  if(phase===0){
    phase=1;
    showPhase('ph-title');
    setTimeout(fanfare,200);
  } else if(phase===1){
    phase=2;
    showPhase('ph-game');
    setTimeout(showNextDialog,400);
  } else if(phase===2){
    if(dlgIdx<DIALOGS.length){
      showNextDialog();
    } else {
      showParser();
    }
  } else if(phase===3){
    if(!parserLocked) runNextCmd();
  }
}

function showNextDialog(){
  if(dlgIdx>=DIALOGS.length){showParser();return;}
  const d=DIALOGS[dlgIdx++];
  document.getElementById('dlg-name').textContent=d.name;
  document.getElementById('dlg-text').textContent=d.text;
  document.getElementById('dialog').style.display='block';
  beep(440,.06,'square',0.08);
}

function showParser(){
  phase=3;
  document.getElementById('dialog').style.display='none';
  document.getElementById('parser').style.display='block';
  setTimeout(()=>runNextCmd(),600);
}

function runNextCmd(){
  if(parserLocked)return;
  if(cmdIdx>=CMD_SEQUENCE.length){
    // Done — prompt to enter EPK
    document.getElementById('parser-resp').textContent='Press ENTER to begin your quest... [launching EPK]';
    parserLocked=true;
    setTimeout(()=>{window.location.href='index.html';},2200);
    return;
  }
  parserLocked=true;
  const cmd=CMD_SEQUENCE[cmdIdx++];
  typeCmd(cmd,()=>{
    const resp=PARSER_CMDS[cmd]||'Nothing happens.';
    if(cmd==='TAKE HAT') addScore(10);
    document.getElementById('parser-resp').textContent=resp;
    beep(330,.05,'square',0.08);
    parserLocked=false;
  });
}

function addScore(n){
  const el=document.getElementById('score');
  let v=parseInt(el.textContent)+n;
  el.textContent=String(v).padStart(5,'0');
}

function typeCmd(cmd,cb){
  const el=document.getElementById('parser-text');
  el.textContent='';
  document.getElementById('parser-resp').textContent='';
  let i=0;
  const iv=setInterval(()=>{
    if(i>=cmd.length){clearInterval(iv);setTimeout(cb,300);return;}
    el.textContent+=cmd[i++];
    beep(880,.02,'square',0.04);
  },55);
}

// Input listeners
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' '||e.key==='ArrowRight'){
    e.preventDefault();advance();
  }
});
document.addEventListener('click',()=>advance());

// Auto-advance from logo after 2.5s
setTimeout(()=>{if(phase===0)advance();},2500);
</script>
</body>
</html>
