<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>NONROCKER_EPK.EXE</title><link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet"/><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#008080;font-family:VT323,monospace;color:#000;display:grid;place-items:center;padding:20px;overflow:hidden}body:before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(to bottom,transparent 0 2px,rgba(0,0,0,.15) 3px,transparent 4px);pointer-events:none}.win{width:min(760px,96vw);background:#c0c0c0;border:2px solid #fff;box-shadow:4px 4px 0 #000}.title{background:#000080;color:#fff;padding:5px 8px;display:flex;justify-content:space-between;font-family:"Press Start 2P";font-size:9px}.body{padding:22px;min-height:390px}.logo{font-family:"Press Start 2P";font-size:clamp(18px,4vw,34px);color:#ff00cc;text-shadow:2px 2px #00e5ff;margin-bottom:16px}.step{font-size:27px;line-height:1.15}.components{display:grid;gap:8px;margin:18px 0}.components label{background:#fff;border:1px inset #777;padding:8px;font-size:23px}.bar{height:28px;border:2px inset #777;background:#fff;margin:18px 0;overflow:hidden}.fill{height:100%;width:0;background:repeating-linear-gradient(90deg,#000080 0 12px,#00aaaa 13px 24px);transition:width .4s}.buttons{display:flex;justify-content:flex-end;gap:10px;border-top:2px groove #fff;padding:12px}.buttons button{font:inherit;font-size:22px;background:#c0c0c0;border:2px outset #fff;padding:3px 20px}.glitch{animation:glitch .12s steps(2,end) infinite}@keyframes glitch{50%{filter:hue-rotate(90deg);transform:translate(2px,-1px)}}@media(max-width:560px){.body{padding:14px}.buttons{justify-content:center}.step{font-size:22px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body>
<main class="win"><div class="title"><span>NONROCKER_EPK.EXE</span><span><a href="variations.html">DIR</a> <a href="index.html">EPK</a></span></div><section class="body" id="body"></section><div class="buttons"><button id="back" type="button">Back</button><button id="next" type="button">Next</button></div></main>
<script>
let step=0;const body=document.getElementById('body'),steps=[
['Install nonrocker records','This wizard installs press copy, cracked drivers, and legally fictional tour dates.'],
['Choose components','<div class="components"><label><input type="checkbox" checked> Kazoo Driver</label><label><input type="checkbox" checked> Didgeridoo Runtime</label><label><input type="checkbox" checked> Drummer Placeholder</label><label><input type="checkbox"> Normal Behavior</label></div>'],
['Installing...','<div class="bar"><div class="fill" id="fill"></div></div><p>Copying SOJU.VXD, SKULL.SYS, PRESSKIT.DLL...</p>'],
['Fatal success','Install failed open. EPK fragments are now loose in memory: tracks, press, booking, tour, and one empty chair.']
];
function render(){body.classList.toggle('glitch',step===3);body.innerHTML=`<div class="logo">nonrocker setup</div><div class="step"><b>${steps[step][0]}</b><p>${steps[step][1]}</p></div>`;document.getElementById('back').disabled=step===0;if(step===2)setTimeout(()=>{const f=document.getElementById('fill');if(f)f.style.width='101%'},50);document.getElementById('next').textContent=step===3?'Reboot':'Next';}
document.getElementById('next').onclick=()=>{step=step===3?0:step+1;render()};document.getElementById('back').onclick=()=>{step=Math.max(0,step-1);render()};addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('next').click();if(e.key==='Backspace')document.getElementById('back').click();});render();
</script></body></html>
