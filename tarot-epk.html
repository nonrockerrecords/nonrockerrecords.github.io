<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>TAROT EPK // nonrocker records</title><link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet"/><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#050008;color:#f4eaff;font-family:VT323,monospace;padding:24px;background-image:radial-gradient(circle at 50% 20%,rgba(255,0,204,.2),transparent 30%),radial-gradient(circle at 20% 80%,rgba(0,229,255,.15),transparent 28%)}body:after{content:"";position:fixed;inset:0;background:repeating-linear-gradient(to bottom,transparent 0 2px,rgba(0,0,0,.2) 3px,transparent 4px);pointer-events:none}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.top a{color:#ff2d78;font-family:"Press Start 2P";font-size:9px;margin-left:8px}h1{font-size:clamp(42px,8vw,96px);line-height:.82;margin:20px 0;text-shadow:3px 0 #ff00cc,-3px 0 #00e5ff}.spread{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:18px}.card{height:280px;perspective:900px;background:transparent;border:0;color:inherit;cursor:pointer}.inner{height:100%;position:relative;transform-style:preserve-3d;transition:transform .5s}.card.flipped .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border:2px solid #ff2d78;background:#120014;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px;box-shadow:0 0 26px rgba(255,0,204,.25)}.front{font-family:"Press Start 2P";font-size:11px}.sig{font-size:72px;color:#00e5ff;text-shadow:0 0 20px #00e5ff}.back{transform:rotateY(180deg);background:#07000a;color:#fff;font-size:23px;line-height:1.05}.back b{color:#39ff14;font-family:"Press Start 2P";font-size:10px}.readout{font-size:24px;color:#ffb800;margin-top:16px}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.card.flipped .inner{transform:none}.back{transform:none}.front{display:none}}</style></head><body>
<header class="top"><div><div style="font-family:'Press Start 2P';font-size:9px;color:#ff2d78">CLICK A CARD // REVEAL EPK OMEN</div><h1>TAROT EPK</h1></div><nav><a href="variations.html">DIRECTORY</a><a href="index.html">EPK</a></nav></header><main class="spread" id="spread"></main><div class="readout" id="r" aria-live="polite">No spread selected.</div>
<script>
const cards=[['THE SOJU','SO','Booking requires green bottles and unstable confidence.'],['THE STATUE','ST','The image melts. The face remains professionally unavailable.'],['THE DRUMMER REVERSED','DR','Denial, absence, legal fog, and a chair with excellent posture.'],['THE COMPILER','CO','All tracks build with warnings. The warnings are the chorus.'],['THE Y2K BUG','YK','The EPK thinks it is 1998 and refuses correction.'],['THE MODEM','MO','Press quotes arrive at 56k, screaming beautifully.']];
const spread=document.getElementById('spread');cards.forEach((c,i)=>spread.insertAdjacentHTML('beforeend',`<button class="card" type="button"><span class="inner"><span class="face front"><span class="sig">${c[1]}</span>${c[0]}</span><span class="face back"><b>${c[0]}</b><br><br>${c[2]}</span></span></button>`));
document.querySelectorAll('.card').forEach((b,i)=>b.onclick=()=>{b.classList.toggle('flipped');document.getElementById('r').textContent=cards[i][2];});addEventListener('keydown',e=>{const n=Number(e.key);if(n>=1&&n<=cards.length)document.querySelectorAll('.card')[n-1].click();});
</script></body></html>
