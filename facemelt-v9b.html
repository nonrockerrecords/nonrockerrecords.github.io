<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FACEMELT V9b // VENETIAN CASCADE+ — nonrocker records</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Bungee+Shade&display=swap" rel="stylesheet">
  <script type="module" src="https://cdn.jsdelivr.net/npm/@spectrum-web-components/bundle@1.7.0/elements.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --pink:#ff00cc; --cyan:#00f0ff; --amber:#ffb800; --lime:#39ff14; --bg:#060408; }
    body { background:var(--bg); font-family:'VT323',monospace; color:#d0c8d0; overflow-x:hidden; }
    body::after { content:''; position:fixed; inset:0;
      background:repeating-linear-gradient(180deg,rgba(0,0,0,0.09) 0px,rgba(0,0,0,0.09) 1px,transparent 1px,transparent 3px);
      pointer-events:none; z-index:9100; }
    body::before { content:''; position:fixed; inset:0;
      background:radial-gradient(ellipse at 50% 50%,transparent 46%,rgba(4,0,8,0.72) 100%);
      pointer-events:none; z-index:9099; }

    #loading { position:fixed; inset:0; z-index:9990; background:var(--bg);
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;
      transition:opacity 0.6s; }
    #loading.done { opacity:0; pointer-events:none; }
    .ld-title { font-family:'Bungee Shade',monospace; font-size:14px; letter-spacing:5px; color:var(--amber); text-shadow:0 0 14px var(--amber); }
    .ld-sub   { font-size:14px; letter-spacing:3px; color:rgba(255,184,0,0.35); }
    .ld-track { width:260px; height:2px; background:rgba(255,184,0,0.12); }
    #ld-bar   { height:100%; width:0%; background:var(--amber); box-shadow:0 0 8px var(--amber); transition:width 0.15s; }
    #ld-step  { font-size:12px; letter-spacing:2px; color:rgba(255,184,0,0.4); }

    #slice-counter { position:fixed; left:14px; bottom:50%; transform:translateY(50%);
      writing-mode:vertical-rl; font-size:11px; letter-spacing:2px;
      color:rgba(255,184,0,0.30); pointer-events:none; z-index:600; }
    #hdr { position:fixed; top:0; left:0; right:0; z-index:500; padding:9px 22px;
      display:flex; align-items:center; gap:12px; background:rgba(6,4,8,0.92);
      border-bottom:1px solid rgba(255,184,0,0.16); backdrop-filter:blur(10px); }
    .hdr-logo  { font-family:'Bungee Shade',monospace; font-size:12px; letter-spacing:3px; color:var(--amber); text-shadow:0 0 10px var(--amber); }
    .hdr-pipe  { width:1px; height:14px; background:rgba(255,184,0,0.22); }
    .hdr-label { font-size:13px; letter-spacing:2px; color:rgba(255,255,255,0.22); }
    .hdr-badge { margin-left:auto; font-size:10px; letter-spacing:2px; color:var(--pink); text-shadow:0 0 8px var(--pink); }

    #journey { height:1200vh; }
    #sticky  { position:sticky; top:0; height:100vh; display:flex; align-items:center; justify-content:center; overflow:hidden; }
    canvas   { display:block; }

    #hud { position:fixed; bottom:0; left:0; right:0; z-index:600; padding:6px 22px 12px;
      display:flex; align-items:center; gap:0; background:rgba(6,4,8,0.80);
      border-top:1px solid rgba(255,184,0,0.10); pointer-events:none; }
    #phase-name { font-size:17px; letter-spacing:5px; color:var(--amber); text-shadow:0 0 12px var(--amber); flex:1; }
    #phase-sub  { font-size:13px; letter-spacing:2px; color:rgba(255,0,204,0.45); }
    #pct        { font-size:13px; letter-spacing:1px; color:rgba(255,255,255,0.18); margin-left:16px; }
    #slice-info { font-size:12px; letter-spacing:1px; color:rgba(255,184,0,0.35); margin-left:14px; }

    #prog { position:fixed; top:32px; left:0; height:1px;
      background:linear-gradient(90deg,var(--amber),var(--pink)); box-shadow:0 0 5px var(--amber); z-index:700; }
    #hint { position:fixed; right:18px; top:50%; transform:translateY(-50%); writing-mode:vertical-rl;
      font-size:13px; letter-spacing:3px; color:rgba(255,184,0,0.28); animation:blink 2s infinite; z-index:600; }
    @keyframes blink { 0%,100%{opacity:.28} 50%{opacity:.75} }
    #foot { padding:50px 24px 38px; text-align:center; border-top:1px solid rgba(255,184,0,0.08);
      display:flex; gap:14px; justify-content:center; flex-wrap:wrap; background:rgba(6,4,8,0.88); }
    sp-theme { display:contents; }
  </style>
</head>
<body>
  <sp-theme color="dark" scale="medium" theme="spectrum-two">
    <div id="loading">
      <div class="ld-title">VENETIAN CASCADE // V9b</div>
      <div class="ld-track"><div id="ld-bar"></div></div>
      <div class="ld-sub">SYNTHESIZING FRAMES</div>
      <div id="ld-step">LOADING IMAGES…</div>
    </div>
    <header id="hdr">
      <span class="hdr-logo">nonrocker records</span>
      <div class="hdr-pipe"></div>
      <span class="hdr-label">FACEMELT V9b</span>
      <div class="hdr-pipe"></div>
      <span class="hdr-label">VENETIAN CASCADE+</span>
      <span class="hdr-badge">NRK-2024 // ENHANCED</span>
    </header>
    <div id="journey"><div id="sticky"><canvas id="cvs"></canvas></div></div>
    <div id="slice-counter">SLICES: –</div>
    <div id="hud">
      <span id="phase-name">PREMELT STATE</span>
      <span id="phase-sub"></span>
      <span id="pct">0%</span>
      <span id="slice-info"></span>
    </div>
    <div id="hint">↓ SCROLL ↓</div>
    <div id="prog" style="width:0%"></div>
    <footer id="foot">
      <sp-button variant="secondary" size="S" onclick="location.href='facemelt-v8b.html'">← V8b WAVE+</sp-button>
      <sp-button variant="secondary" size="S" onclick="location.href='slides.html'">SLIDES</sp-button>
      <sp-button variant="secondary" size="S" onclick="location.href='facemelt-v7b.html'">V7b POUR+</sp-button>
    </footer>
  </sp-theme>
  <script>
  (() => {
    'use strict';

    // ── DOM ──────────────────────────────────────────────────────────────────────
    const cvs      = document.getElementById('cvs');
    const ctx      = cvs.getContext('2d');
    const hud      = { name:document.getElementById('phase-name'), sub:document.getElementById('phase-sub'), pct:document.getElementById('pct'), info:document.getElementById('slice-info') };
    const sliceCtr = document.getElementById('slice-counter');
    const prog     = document.getElementById('prog');
    const ldBar    = document.getElementById('ld-bar');
    const ldStep   = document.getElementById('ld-step');
    const loading  = document.getElementById('loading');

    // ── Math helpers ─────────────────────────────────────────────────────────────
    const clamp   = (v,a,b) => Math.max(a, Math.min(b,v));
    const invlerp = (a,b,v) => clamp((v-a)/(b-a), 0, 1);
    const eio     = t => t<.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
    const eo      = t => 1 - Math.pow(1-t, 3);

    // ── Geometry ─────────────────────────────────────────────────────────────────
    let W=0,H=0, imgX=0,imgY=0,imgW=0,imgH=0, SKULL_CY=0;
    const SKULL_Y_FRAC = 0.32;

    function resize() {
      W = cvs.width  = window.innerWidth;
      H = cvs.height = window.innerHeight;
      const ar = allImgs[0].naturalWidth / allImgs[0].naturalHeight;
      if (H*ar < W*0.72) { imgH=H*0.92; imgW=imgH*ar; } else { imgW=W*0.70; imgH=imgW/ar; }
      imgX=(W-imgW)/2; imgY=(H-imgH)/2;
      SKULL_CY = imgY + imgH*SKULL_Y_FRAC;
      computeSlices();
      initBloom();
    }
    window.addEventListener('resize', () => { if (ready) resize(); });

    // ── Image loading + pixel-blend synthetics ────────────────────────────────────
    let allImgs=[], synthA25,synthA50,synthA75,synthB25,synthB50,synthB75, ready=false;

    function loadImg(src) {
      return new Promise(res => { const i=new Image(); i.onload=()=>res(i); i.onerror=()=>res(null); i.src=src; });
    }

    function pixelBlend(i1,i2,alpha) {
      const MAX=640, ar=i1.naturalHeight/i1.naturalWidth;
      const w=Math.min(i1.naturalWidth,MAX), h=Math.round(w*ar);
      const oc=document.createElement('canvas'); oc.width=w; oc.height=h;
      const ox=oc.getContext('2d');
      ox.drawImage(i1,0,0,w,h); const d1=ox.getImageData(0,0,w,h).data;
      ox.clearRect(0,0,w,h);
      ox.drawImage(i2,0,0,w,h); const d2=ox.getImageData(0,0,w,h).data;
      const out=ox.createImageData(w,h); const od=out.data;
      const b=alpha, a=1-alpha;
      for (let i=0;i<od.length;i++) od[i]=d1[i]*a+d2[i]*b;
      ox.putImageData(out,0,0); return oc;
    }

    async function setLoad(pct, label) {
      ldBar.style.width = pct+'%';
      ldStep.textContent = label;
      await new Promise(r=>setTimeout(r,10));
    }

    async function init() {
      allImgs = await Promise.all(['facemelt-premelt.png','Facemelt.png','Facemelt-endmelt.png'].map(loadImg));
      if (!allImgs.every(Boolean)) { ldStep.textContent='ERROR: IMAGES NOT FOUND'; return; }
      await setLoad(10,'BLENDING A 25%…');  synthA25 = pixelBlend(allImgs[0],allImgs[1],0.25);
      await setLoad(25,'BLENDING A 50%…');  synthA50 = pixelBlend(allImgs[0],allImgs[1],0.50);
      await setLoad(40,'BLENDING A 75%…');  synthA75 = pixelBlend(allImgs[0],allImgs[1],0.75);
      await setLoad(55,'BLENDING B 25%…');  synthB25 = pixelBlend(allImgs[1],allImgs[2],0.25);
      await setLoad(70,'BLENDING B 50%…');  synthB50 = pixelBlend(allImgs[1],allImgs[2],0.50);
      await setLoad(85,'BLENDING B 75%…');  synthB75 = pixelBlend(allImgs[1],allImgs[2],0.75);
      await setLoad(100,'READY');
      await new Promise(r=>setTimeout(r,250));
      loading.classList.add('done');
      setTimeout(()=>{ loading.style.display='none'; },700);
      ready=true; resize(); requestAnimationFrame(draw);
    }
    init();

    // ── Slice setup ───────────────────────────────────────────────────────────────
    const SLICE_H = 4;
    let nSlices=0, sliceVariance=[], sliceRandom=[], prevRevArr=new Uint8Array(0);

    function computeSlices() {
      nSlices = Math.ceil(imgH/SLICE_H);
      if (sliceVariance.length < nSlices) {
        sliceVariance = Array.from({length:nSlices}, ()=>Math.random());
        sliceRandom   = Array.from({length:nSlices}, ()=>0.05+Math.random()*0.87);
      }
      if (prevRevArr.length < nSlices) prevRevArr = new Uint8Array(nSlices);
      sliceCtr.textContent = `SLICES: ${nSlices}`;
    }

    function sliceRevealed(i, progress, mode) {
      const r = i/nSlices;
      const v = (sliceVariance[i%sliceVariance.length]-0.5)*0.14;
      switch(mode) {
        case 'topdown':   return progress > r+v;
        case 'bottomup':  return progress > (1-r)+v;
        case 'centerout': {
          const dist = Math.abs(r-SKULL_Y_FRAC)/Math.max(SKULL_Y_FRAC,1-SKULL_Y_FRAC);
          return progress > dist+v;
        }
        case 'random': return progress > sliceRandom[i%sliceRandom.length];
      }
      return false;
    }

    // ── Particle system ───────────────────────────────────────────────────────────
    class ParticleSystem {
      constructor(max=600) { this.pool=[]; this.max=max; }
      emit(x,y,{vx,vy,life,size,color,gravity=0.06}) {
        if (this.pool.length>=this.max) return;
        this.pool.push({x,y,vx,vy,life,maxLife:life,size,color,gravity,alpha:1});
      }
      update(dt) {
        for (let i=this.pool.length-1;i>=0;i--) {
          const p=this.pool[i];
          p.x+=p.vx*dt*60; p.vy+=p.gravity; p.y+=p.vy*dt*60;
          p.life--; p.alpha=p.life/p.maxLife;
          if(p.life<=0) this.pool.splice(i,1);
        }
      }
      draw(ctx) {
        ctx.save();
        this.pool.forEach(p=>{
          ctx.globalAlpha=p.alpha*0.9;
          ctx.fillStyle=p.color;
          ctx.shadowColor=p.color; ctx.shadowBlur=p.size*4;
          ctx.beginPath(); ctx.arc(p.x,p.y,p.size*Math.max(0.1,p.alpha),0,Math.PI*2); ctx.fill();
        });
        ctx.restore();
      }
    }
    const ps = new ParticleSystem(700);

    // ── Bloom ─────────────────────────────────────────────────────────────────────
    let bloomC, bloomCtx;
    function initBloom() {
      bloomC = document.createElement('canvas');
      bloomC.width=W>>1; bloomC.height=H>>1;
      bloomCtx=bloomC.getContext('2d');
    }
    function applyBloom(alpha=0.20) {
      const bW=bloomC.width, bH=bloomC.height;
      bloomCtx.clearRect(0,0,bW,bH);
      bloomCtx.filter='blur(9px) brightness(2.2)';
      bloomCtx.drawImage(cvs,0,0,bW,bH);
      bloomCtx.filter='none';
      ctx.save();
      ctx.globalCompositeOperation='screen';
      ctx.globalAlpha=alpha;
      ctx.drawImage(bloomC,0,0,W,H);
      ctx.restore();
    }

    // ── Heat haze displacement ────────────────────────────────────────────────────
    let hazeFrame=0;
    function applyHeatHaze(centerY, stripH, amp) {
      if (amp<0.6) return;
      hazeFrame++;
      if (hazeFrame%2!==0) return; // every other frame (perf)
      const y0=Math.max(0,Math.floor(centerY-stripH/2));
      const y1=Math.min(H,Math.ceil(centerY+stripH/2));
      const h=y1-y0; if(h<=0) return;
      const src=ctx.getImageData(0,y0,W,h);
      const dst=ctx.createImageData(W,h);
      const sd=src.data,dd=dst.data;
      const t=performance.now()/1000;
      for (let row=0;row<h;row++) {
        const wY=y0+row, env=Math.sin((row/h)*Math.PI);
        for (let col=0;col<W;col++) {
          const dx=Math.round(amp*env*Math.sin(wY*0.19+col*0.04+t*2.3));
          const dy=Math.round(amp*0.3*env*Math.sin(col*0.13+t*1.7));
          const sc=clamp(col+dx,0,W-1), sr=clamp(row+dy,0,h-1);
          const si=(sr*W+sc)*4, di=(row*W+col)*4;
          dd[di]=sd[si]; dd[di+1]=sd[si+1]; dd[di+2]=sd[si+2]; dd[di+3]=sd[si+3];
        }
      }
      ctx.putImageData(dst,0,y0);
    }

    // ── Scroll ───────────────────────────────────────────────────────────────────
    let scrollT=0;
    window.addEventListener('scroll',()=>{
      const el=document.getElementById('journey');
      scrollT=clamp(window.scrollY/(el.offsetHeight-window.innerHeight),0,1);
      prog.style.width=(scrollT*100)+'%';
    },{passive:true});

    // ── Draw helpers ──────────────────────────────────────────────────────────────
    function drawFull(img,alpha=1) {
      if(!img||alpha<=0) return;
      ctx.save(); ctx.globalAlpha=clamp(alpha,0,1);
      ctx.drawImage(img,imgX,imgY,imgW,imgH);
      ctx.restore();
    }

    // ── Venetian draw (returns revealed count, emits particles, applies haze) ─────
    function drawVenetian(imgA, imgB, progress, animT, mode) {
      drawFull(imgA);

      ctx.save(); ctx.beginPath();
      let revealCount=0, newCount=0;
      for (let i=0;i<nSlices;i++) {
        const nowRev = sliceRevealed(i,progress,mode) ? 1 : 0;
        if (nowRev) {
          const sy=imgY+i*SLICE_H, sh=Math.min(SLICE_H,imgY+imgH-sy);
          if(sh>0) { ctx.rect(0,sy,W,sh); revealCount++; }
        }
        // Particle emission on newly-flipped slices (rate-limited)
        if (nowRev && !prevRevArr[i] && newCount%4===0) {
          const sy=imgY+i*SLICE_H+SLICE_H/2;
          for (let k=0;k<5;k++) {
            ps.emit(imgX+Math.random()*imgW, sy, {
              vx:(Math.random()-0.5)*11,
              vy:(Math.random()-0.5)*2.5,
              life:(18+Math.random()*18)|0,
              size:1.2+Math.random()*1.6,
              color:Math.random()<0.6?'#ffb800':'#ff00cc',
              gravity:0.05
            });
          }
          newCount++;
        }
        prevRevArr[i]=nowRev;
      }
      ctx.clip(); drawFull(imgB); ctx.restore();

      // Glow at wave front
      ctx.save(); ctx.shadowColor='#ffb800'; ctx.shadowBlur=10;
      const gAmp = 0.55+0.35*Math.sin(animT*6);

      if (mode==='topdown') {
        const fy=imgY+progress*imgH;
        ctx.fillStyle=`rgba(255,184,0,${gAmp})`; ctx.fillRect(0,fy-2,W,4);
        ctx.fillStyle=`rgba(255,0,204,${gAmp*0.4})`; ctx.fillRect(0,fy+3,W,2);
        // Heat haze at front
        applyHeatHaze(fy, 40, 7*Math.sin(progress*Math.PI));
      } else if (mode==='bottomup') {
        const fy=imgY+(1-progress)*imgH;
        ctx.fillStyle=`rgba(255,184,0,${gAmp})`; ctx.fillRect(0,fy-2,W,4);
        ctx.fillStyle=`rgba(255,0,204,${gAmp*0.4})`; ctx.fillRect(0,fy-5,W,2);
        applyHeatHaze(fy, 40, 7*Math.sin(progress*Math.PI));
      } else if (mode==='centerout') {
        const maxSpread=Math.max(SKULL_CY-imgY,imgH-(SKULL_CY-imgY));
        const spread=eo(progress)*maxSpread;
        ctx.fillStyle=`rgba(255,184,0,${gAmp})`;
        if(SKULL_CY-spread>=imgY)      ctx.fillRect(0,SKULL_CY-spread-2,W,4);
        if(SKULL_CY+spread<=imgY+imgH) ctx.fillRect(0,SKULL_CY+spread-2,W,4);
        applyHeatHaze(SKULL_CY, 45, 6*Math.sin(progress*Math.PI));
      }
      ctx.restore();

      return revealCount;
    }

    // ── Phase dispatch (8 sub-transitions + 3 holds) ─────────────────────────────
    function getPhase(t) {
      if (t<0.07) return { name:'PREMELT STATE',        sub:'',               img:allImgs[0] };
      if (t<0.20) return { name:'BLINDS: TOP→DOWN',     sub:'PREMELT → 25%',  draw:(p,at)=>drawVenetian(allImgs[0],synthA25,eio(p),at,'topdown'),   p:invlerp(0.07,0.20,t) };
      if (t<0.33) return { name:'BLINDS: CENTER BURST', sub:'25% → 50%',      draw:(p,at)=>drawVenetian(synthA25,synthA50,eio(p),at,'centerout'),    p:invlerp(0.20,0.33,t) };
      if (t<0.44) return { name:'BLINDS: CHAOS',        sub:'50% → 75%',      draw:(p,at)=>drawVenetian(synthA50,synthA75,eio(p),at,'random'),       p:invlerp(0.33,0.44,t) };
      if (t<0.54) return { name:'BLINDS: BOTTOM→UP',    sub:'75% → FACEMELT', draw:(p,at)=>drawVenetian(synthA75,allImgs[1],eio(p),at,'bottomup'),   p:invlerp(0.44,0.54,t) };
      if (t<0.61) return { name:'MID MELT',             sub:'',               img:allImgs[1] };
      if (t<0.70) return { name:'BLINDS: TOP→DOWN',     sub:'FACEMELT → 25%', draw:(p,at)=>drawVenetian(allImgs[1],synthB25,eio(p),at,'topdown'),    p:invlerp(0.61,0.70,t) };
      if (t<0.79) return { name:'BLINDS: CENTER BURST', sub:'25% → 50%',      draw:(p,at)=>drawVenetian(synthB25,synthB50,eio(p),at,'centerout'),    p:invlerp(0.70,0.79,t) };
      if (t<0.88) return { name:'BLINDS: CHAOS',        sub:'50% → 75%',      draw:(p,at)=>drawVenetian(synthB50,synthB75,eio(p),at,'random'),       p:invlerp(0.79,0.88,t) };
      if (t<0.95) return { name:'BLINDS: BOTTOM→UP',   sub:'75% → END MELT', draw:(p,at)=>drawVenetian(synthB75,allImgs[2],eio(p),at,'bottomup'),   p:invlerp(0.88,0.95,t) };
      return              { name:'END STATE',            sub:'MELT COMPLETE',  img:allImgs[2] };
    }

    // ── Main loop ─────────────────────────────────────────────────────────────────
    let animT=0, lastTS=0;

    function draw(ts=0) {
      requestAnimationFrame(draw);
      if(!ready) return;
      const dt=Math.min((ts-lastTS)/1000,0.05);
      lastTS=ts; animT+=dt;

      const t=scrollT;
      const ph=getPhase(t);

      ctx.clearRect(0,0,W,H);
      ctx.fillStyle='#060408'; ctx.fillRect(0,0,W,H);

      let revCount=0;
      if (ph.img) {
        drawFull(ph.img);
        if (ph.img!==allImgs[0]) {
          const skulCX=imgX+imgW*0.50;
          const pulse=0.14+Math.sin(animT*2.5)*0.08;
          ctx.save(); ctx.globalCompositeOperation='screen';
          const grd=ctx.createRadialGradient(skulCX,SKULL_CY,0,skulCX,SKULL_CY,imgW*0.36);
          grd.addColorStop(0,`rgba(255,184,0,${pulse*0.6})`);
          grd.addColorStop(0.4,`rgba(255,0,204,${pulse*0.4})`);
          grd.addColorStop(1,'rgba(0,0,0,0)');
          ctx.fillStyle=grd; ctx.fillRect(0,0,W,H); ctx.restore();
        }
      } else {
        revCount=ph.draw(ph.p,animT)||0;
      }

      // Particles
      ps.update(dt); ps.draw(ctx);

      // Bloom (stronger on hold states)
      applyBloom(ph.img && ph.img!==allImgs[0] ? 0.28 : 0.16);

      // CRT drift line
      const ry=animT*20%H;
      ctx.save(); ctx.globalAlpha=0.025; ctx.fillStyle='#ffb800';
      [ry,(ry+H*0.5)%H].forEach(y=>ctx.fillRect(0,y,W,1));
      ctx.restore();

      hud.name.textContent=ph.name;
      hud.sub.textContent=ph.sub||'';
      hud.pct.textContent=Math.round(t*100)+'%';
      hud.info.textContent=revCount>0?`${revCount}/${nSlices} SLICES`:'';
    }
  })();
  </script>
</body>
</html>
